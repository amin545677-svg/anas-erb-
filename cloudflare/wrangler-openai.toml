name = "anas-erp-openai-ai"
main = "worker_openai_ai.js"
compatibility_date = "2026-10-22"
workers_dev = true

[vars]
OPENAI_MODEL = "gpt-4.1-mini"
FIREBASE_PROJECT_ID = "anas-erb"
ALLOWED_ORIGINS = "https://amin545677-svg.github.io"

# Per-Firebase-UID and per-source-IP edge limits, evaluated before paid OpenAI calls.
[[ratelimits]]
name = "AI_USER_RATE_LIMITER"
namespace_id = "930001"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "AI_IP_RATE_LIMITER"
namespace_id = "930002"
simple = { limit = 40, period = 60 }
