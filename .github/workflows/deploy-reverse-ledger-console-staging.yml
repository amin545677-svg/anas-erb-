name: Deploy ANAS ERP Reverse Ledger Console (Staging)
# Scoped push-trigger probe: 2026-10-31 live Staging preflight.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'staging/**'
      - 'reverse-ledger/**'
      - 'firebase.staging.hosting.json'
      - '.github/workflows/deploy-reverse-ledger-console-staging.yml'
      - 'tests/**'
  push:
    branches:
      - staging/unified-release-candidate
      - feat/reverse-ledger-firebase-functions-v2
    paths:
      - 'staging/**'
      - 'reverse-ledger/**'
      - 'firebase.staging.hosting.json'
      - '.github/workflows/deploy-reverse-ledger-console-staging.yml'
      - 'tests/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: anas-erp-reverse-ledger-console-staging
  cancel-in-progress: false

jobs:
  validate-staging-console-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'staging/unified-release-candidate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate source without deployment credentials
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate isolated hosting configuration and console sources
        run: |
          node -e "const c=require('./firebase.staging.hosting.json'); if(c.hosting.site!=='anas-erp-staging-a25e1'||c.hosting.public!=='staging-site') process.exit(1)"
          node --check staging/reverse-ledger-gateway.js
          node --check reverse-ledger/reverse-ledger.js

  deploy-staging-console:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(fromJSON('["refs/heads/staging/unified-release-candidate","refs/heads/feat/reverse-ledger-firebase-functions-v2"]'), github.ref))
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated staging candidate
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Secret Presence Preflight (zero-leak, dual-scope)
        env:
          FIREBASE_STAGING_WEB_API_KEY: ${{ secrets.FIREBASE_STAGING_WEB_API_KEY }}
          FIREBASE_STAGING_WEB_APP_ID: ${{ secrets.FIREBASE_STAGING_WEB_APP_ID }}
          FIREBASE_STAGING_APP_CHECK_SITE_KEY: ${{ secrets.FIREBASE_STAGING_APP_CHECK_SITE_KEY }}
          WIF_PROVIDER: ${{ vars.ANAS_STAGING_WIF_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          node <<'NODE'
          const names = ["FIREBASE_STAGING_WEB_API_KEY","FIREBASE_STAGING_WEB_APP_ID","FIREBASE_STAGING_APP_CHECK_SITE_KEY","WIF_PROVIDER","DEPLOYER_SERVICE_ACCOUNT"];
          let missing = false;
          console.log('STAGING SECRET PRESENCE (values suppressed)');
          console.log('| Variable | Status |');
          console.log('|---|---|');
          for (const name of names) {
            const present = Boolean((process.env[name] || '').trim());
            console.log('| ' + name + ' | ' + (present ? 'PRESENT' : 'MISSING') + ' |');
            if (!present) missing = true;
          }
          if (missing) { console.error('STAGING PREFLIGHT: BLOCKED'); process.exit(1); }
          NODE

      - name: Validate dedicated staging-only configuration
        env:
          WIF_PROVIDER: ${{ vars.ANAS_STAGING_WIF_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo "::error::Missing ANAS_STAGING_WIF_PROVIDER environment variable."; exit 1; }
          test -n "$DEPLOYER_SERVICE_ACCOUNT" || { echo "::error::Missing ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT environment variable."; exit 1; }
          case "$WIF_PROVIDER" in projects/*/locations/global/workloadIdentityPools/*/providers/*) ;; *) echo "::error::Invalid Workload Identity Provider resource name."; exit 1 ;; esac
          case "$DEPLOYER_SERVICE_ACCOUNT" in *@*.iam.gserviceaccount.com) ;; *) echo "::error::Invalid staging deployer service-account email."; exit 1 ;; esac

      - name: Authenticate to Firebase Staging with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.ANAS_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Build isolated staging console with staging-only Firebase config
        env:
          FIREBASE_STAGING_WEB_API_KEY: ${{ secrets.FIREBASE_STAGING_WEB_API_KEY }}
          FIREBASE_STAGING_WEB_APP_ID: ${{ secrets.FIREBASE_STAGING_WEB_APP_ID }}
          FIREBASE_STAGING_APP_CHECK_SITE_KEY: ${{ secrets.FIREBASE_STAGING_APP_CHECK_SITE_KEY }}
        run: |
          set -euo pipefail
          rm -rf staging-site
          mkdir -p staging-site/reverse-ledger
          cp staging/index.html staging-site/index.html
          cp staging/reverse-ledger-gateway.js staging-site/reverse-ledger-gateway.js
          cp reverse-ledger/reverse-ledger.js reverse-ledger/reverse-ledger-modal.js staging-site/reverse-ledger/
          sed -i 's#../reverse-ledger/#./reverse-ledger/#g' staging-site/index.html
          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            firebaseConfig: {
              apiKey: process.env.FIREBASE_STAGING_WEB_API_KEY,
              authDomain: 'anas-erp-staging-a25e1.firebaseapp.com',
              projectId: 'anas-erp-staging-a25e1',
              appId: process.env.FIREBASE_STAGING_WEB_APP_ID
            },
            appCheckSiteKey: process.env.FIREBASE_STAGING_APP_CHECK_SITE_KEY,
            allowedOrigins: ['https://anas-erp-staging-a25e1.web.app'],
            functionsRegion: 'us-central1'
          };
          for (const [key, value] of Object.entries({
            apiKey: config.firebaseConfig.apiKey,
            appId: config.firebaseConfig.appId,
            appCheckSiteKey: config.appCheckSiteKey
          })) {
            if (typeof value !== 'string' || !value.trim() || value.length > 512) {
              throw new Error('Invalid staging public config field: ' + key);
            }
          }
          fs.writeFileSync('staging-site/config.js',
            'window.ANAS_REVERSE_LEDGER_STAGING_CONFIG = ' + JSON.stringify(config) + ';\n',
            { mode: 0o600 });
          NODE
          test -f staging-site/index.html
          test -f staging-site/config.js
          test -f staging-site/reverse-ledger-gateway.js
          test -f staging-site/reverse-ledger/reverse-ledger.js
          ! grep -q 'projectId:"anas-erb"' staging-site/config.js
          grep -q 'anas-erp-staging-a25e1' staging-site/config.js
          grep -q './reverse-ledger/reverse-ledger.js' staging-site/index.html
          grep -q 'noindex,nofollow' staging-site/index.html

      - name: Validate isolated hosting configuration
        run: |
          node -e "const c=require('./firebase.staging.hosting.json'); if(c.hosting.site!=='anas-erp-staging-a25e1'||c.hosting.public!=='staging-site') process.exit(1)"
          node --check staging-site/config.js
          node --check staging-site/reverse-ledger-gateway.js

      - name: Deploy only the dedicated staging console
        run: npx --yes firebase-tools@14.22.0 deploy --only hosting --config firebase.staging.hosting.json --project anas-erp-staging-a25e1 --non-interactive

      - name: Verify live staging console and public config scope
        env:
          STAGING_ORIGIN: https://anas-erp-staging-a25e1.web.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$STAGING_ORIGIN/" | grep -q 'ANAS ERP — بيئة اختبار دفتر المرتجعات'
          curl --fail --silent --show-error "$STAGING_ORIGIN/config.js" | grep -q '"projectId":"anas-erp-staging-a25e1"'
          curl --fail --silent --show-error "$STAGING_ORIGIN/config.js" | grep -Fq '"allowedOrigins":["https://anas-erp-staging-a25e1.web.app"]'
          echo "PASS: dedicated staging console and staging-only public Firebase configuration are live."
