name: Deploy ANAS ERP Reverse Ledger Console (Staging)
# Security boundary: PRs validate without credentials; trusted branch pushes deploy only after the matching Staging Test Gate succeeds.
# Deployments are serialized so queued candidate pushes cannot race the dedicated Hosting site.
# The pull_request validation job is deliberately credential-free; the push deployment job waits for the exact SHA's successful Gate.
# Shared staging credential preflight accepts V2 raw JSON or Base64 and validates the staging project before auth.
# Scoped push-trigger probe: 2026-10-31 live Staging preflight.

on:
  pull_request:
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'storage/**'
      - 'sync/**'
      - 'staging/**'
      - 'scripts/build-staging-hosting.mjs'
      - 'scripts/resolve-staging-web-api-key.mjs'
      - 'scripts/prepare-staging-service-account.mjs'
      - 'scripts/assert-staging-deployment-identity.mjs'
      - 'reverse-ledger/**'
      - 'firebase.staging.hosting.json'
      - '.github/workflows/deploy-reverse-ledger-console-staging.yml'
      - '.github/workflows/deploy-reverse-ledger-functions-staging.yml'
      - '.github/workflows/staging-test-gate.yml'
      - '.github/workflows/anas-erp-safety-checks.yml'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      run_functions_live_acceptance:
        description: "Optional Functions-dependent live acceptance; keep disabled while the Spark project has no billing account."
        required: false
        type: boolean
        default: false
  push:
    branches:
      - staging/unified-release-candidate
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'storage/**'
      - 'sync/**'
      - 'staging/**'
      - 'scripts/build-staging-hosting.mjs'
      - 'scripts/resolve-staging-web-api-key.mjs'
      - 'scripts/prepare-staging-service-account.mjs'
      - 'scripts/assert-staging-deployment-identity.mjs'
      - 'reverse-ledger/**'
      - 'firebase.staging.hosting.json'
      - '.github/workflows/deploy-reverse-ledger-console-staging.yml'
      - '.github/workflows/deploy-reverse-ledger-functions-staging.yml'
      - '.github/workflows/staging-test-gate.yml'
      - '.github/workflows/anas-erp-safety-checks.yml'
      - 'tests/**'

permissions:
  contents: read
  actions: read

# PR validation uses its own group so it cannot cancel or replace a queued staging deployment.
concurrency:
  group: anas-erp-reverse-ledger-console-staging-v3-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: false

jobs:
  staging-project-guard:
    if: ${{ github.ref == 'refs/heads/staging/unified-release-candidate' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staging candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify staging-only Hosting bundle contract
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cfg = JSON.parse(fs.readFileSync('firebase.staging.hosting.json', 'utf8'));
          if (cfg.hosting?.site !== 'anas-erp-staging-a25e1' || cfg.hosting?.public !== 'staging-site') throw new Error('Hosting target is not isolated Staging');
          if (!fs.readFileSync('sw.js', 'utf8').includes("const CACHE = 'anas-erp-v54-25-r39';")) throw new Error('Root Service Worker is not r39');
          if (!fs.readFileSync('scripts/build-staging-hosting.mjs', 'utf8').includes(" | SW: r39 | Env: Staging")) throw new Error('ERP build stamp does not match r39 Service Worker');
          if (!fs.readFileSync('index.html', 'utf8').includes('Build SHA: __ANAS_BUILD_SHA__ | SW: r26 | Env: Staging')) throw new Error('Canonical source stamp placeholder changed unexpectedly');
          NODE
          npm install --no-audit --no-fund
          node --check scripts/build-staging-hosting.mjs
          node --test tests/staging_hosting_bundle.test.mjs tests/staging_deployment_identity_guard.test.mjs

  validate-staging-console-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'staging/unified-release-candidate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate source without deployment credentials
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate isolated hosting configuration and console sources
        run: |
          node -e "const c=require('./firebase.staging.hosting.json'); if(c.hosting.site!=='anas-erp-staging-a25e1'||c.hosting.public!=='staging-site') process.exit(1)"
          node --check scripts/assert-staging-deployment-identity.mjs
          node --check scripts/resolve-staging-web-api-key.mjs
          node --check tests/staging_deployment_identity_guard.test.mjs
          node --test tests/staging_deployment_identity_guard.test.mjs tests/staging_service_account_preflight.test.mjs
          node --check staging/reverse-ledger-gateway.js
          node --check reverse-ledger/reverse-ledger.js

  # Deploy trusted pushes after the isolated project guard and exact-SHA Staging Test Gate.
  deploy-staging-console:
    needs: staging-project-guard
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging/unified-release-candidate' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated staging candidate
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for matching Staging Test Gate success
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs?branch=${encodeURIComponent(process.env.GITHUB_REF_NAME)}&event=push&per_page=100`;
          const headers = {
            authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
            accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };
          for (let attempt = 1; attempt <= 140; attempt++) {
            const response = await fetch(endpoint, { headers });
            if (!response.ok) throw new Error('Unable to inspect Staging Test Gate runs: HTTP ' + response.status);
            const payload = await response.json();
            const gate = (payload.workflow_runs || []).find(run =>
              run.name === 'Staging Test Gate' &&
              ['push', 'pull_request'].includes(run.event) &&
              run.head_sha === process.env.GITHUB_SHA
            );
            if (gate?.status === 'completed') {
              if (gate.conclusion !== 'success') {
                throw new Error('Matching Staging Test Gate did not pass: ' + gate.conclusion);
              }
              console.log('PASS: Staging Test Gate succeeded for exact deployment SHA ' + process.env.GITHUB_SHA);
              process.exit(0);
            }
            console.log('Waiting for Staging Test Gate on exact SHA; attempt ' + attempt + '/140.');
            await new Promise(resolve => setTimeout(resolve, 15000));
          }
          throw new Error('Timed out waiting for a successful Staging Test Gate on the exact Hosting deployment SHA.');
          NODE

      - name: Secret Presence Preflight (raw JSON or Base64 service-account, OIDC fallback)
        id: auth_preflight
        env:
          FIREBASE_STAGING_WEB_APP_ID: ${{ secrets.FIREBASE_STAGING_WEB_APP_ID }}
          FIREBASE_STAGING_APP_CHECK_SITE_KEY: ${{ secrets.FIREBASE_STAGING_APP_CHECK_SITE_KEY }}
          DEPLOY_SERVICE_ACCOUNT_INPUT: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT || secrets.FIREBASE_STAGING_SERVICE_ACCOUNT_V2 }}
          WIF_PROVIDER: ${{ vars.ANAS_STAGING_WIF_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          node -e "for (const name of ['FIREBASE_STAGING_WEB_APP_ID']) if (!(process.env[name] || '').trim()) { console.error('STAGING PREFLIGHT: missing ' + name); process.exit(1); }"
          node scripts/prepare-staging-service-account.mjs

      - name: Resolve, sanitize and validate Firebase Staging Web API key (secret then live fallback)
        env:
          FIREBASE_STAGING_WEB_API_KEY: ${{ secrets.FIREBASE_STAGING_WEB_API_KEY }}
        run: node --check scripts/resolve-staging-web-api-key.mjs && node scripts/resolve-staging-web-api-key.mjs
      - name: Require sanitized Firebase Web API key for Hosting build
        run: |
          node --input-type=module -e '
            const key = process.env.FIREBASE_STAGING_WEB_API_KEY || "";
            if (!/^AIza[0-9A-Za-z_-]{35}$/.test(key)) {
              console.error("STAGING CONFIG BLOCKED: sanitized Firebase Web API key is absent or has an invalid format.");
              process.exit(1);
            }
            console.log("PASS: sanitized Firebase Web API key is present for the Hosting build; value withheld.");
          '
      - name: Authenticate to Firebase Staging with service-account JSON
        if: ${{ steps.auth_preflight.outputs.auth_mode == 'json' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.STAGING_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true

      - name: Authenticate to Firebase Staging with GitHub OIDC fallback
        if: ${{ steps.auth_preflight.outputs.auth_mode == 'oidc' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.ANAS_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enforce staging deployment identity before any deploy action
        env:
          FIREBASE_PROJECT_ID: anas-erp-staging-a25e1
          GCLOUD_PROJECT: anas-erp-staging-a25e1
          GOOGLE_CLOUD_PROJECT: anas-erp-staging-a25e1
          ANAS_STAGING_WIF_PROVIDER: ${{ vars.ANAS_STAGING_WIF_PROVIDER }}
          ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          configured_project="$(gcloud config get-value project 2>/dev/null || true)"
          if [ -n "$configured_project" ] && [ "$configured_project" != "(unset)" ] && [ "$configured_project" != "$GCLOUD_PROJECT" ]; then
            echo "Refusing deployment: pre-existing gcloud project differs from isolated staging."
            exit 1
          fi
          gcloud config set project "$GCLOUD_PROJECT" --quiet
          node scripts/assert-staging-deployment-identity.mjs

      - name: Install pinned local ERP browser parser dependencies
        run: npm install --no-audit --no-fund

      - name: Build full ERP/POS PWA and isolated reverse-ledger console
        env:
          ANAS_BUILD_SHA: ${{ github.sha }}
          FIREBASE_STAGING_WEB_APP_ID: ${{ secrets.FIREBASE_STAGING_WEB_APP_ID }}
          FIREBASE_STAGING_APP_CHECK_SITE_KEY: ${{ secrets.FIREBASE_STAGING_APP_CHECK_SITE_KEY }}
        run: node scripts/build-staging-hosting.mjs

      - name: Validate isolated hosting configuration
        run: |
          node -e "const c=require('./firebase.staging.hosting.json'); if(c.hosting.site!=='anas-erp-staging-a25e1'||c.hosting.public!=='staging-site') process.exit(1)"
          node --check staging-site/config.js
          node --check staging-site/reverse-ledger-gateway.js
          test -f staging-site/erp/index.html
          test -f staging-site/erp/sw.js
          test -f staging-site/erp/vendor/firebase/firebase-compat.js
          ! grep -q 'www.gstatic.com/firebasejs' staging-site/erp/index.html
          test -f staging-site/erp/vendor/xlsx/xlsx.full.min.js
          test -f staging-site/erp/vendor/pdfjs/pdf.min.js
          test -f staging-site/erp/vendor/pdfjs/pdf.worker.min.js
          test -f staging-site/erp/storage/android-resilient-storage.js
          test -f staging-site/erp/manifest.webmanifest
          ! grep -q 'projectId:"anas-erb"' staging-site/erp/index.html
          grep -q 'projectId":"anas-erp-staging-a25e1' staging-site/erp/index.html

      - name: Deploy only the dedicated staging ERP and console
        run: npx --yes firebase-tools@14.22.0 deploy --only hosting --config firebase.staging.hosting.json --project anas-erp-staging-a25e1 --non-interactive

      - name: Verify live staging ERP, offline assets, console and public config scope
        env:
          STAGING_ORIGIN: https://anas-erp-staging-a25e1.web.app
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha="${DEPLOY_SHA:0:7}"
          fetch_expect() {
            local path="$1" label="$2" pattern="$3" body status attempt
            body="$(mktemp)"
            status="000"
            for attempt in $(seq 1 12); do
              status="$(curl --location --silent --show-error --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' --output "$body" --write-out '%{http_code}' "$STAGING_ORIGIN$path?__verify_sha=${DEPLOY_SHA}" 2>/dev/null || true)"
              if [ "$status" = "200" ]; then
                if grep -Fq "$pattern" "$body"; then
                  rm -f "$body"
                  echo "PASS: $label"
                  return 0
                fi
                echo "STAGING VERIFY: HTTP 200 but expected content missing at $path ($label)." >&2
                rm -f "$body"
                return 1
              fi
              sleep 5
            done
            echo "STAGING VERIFY: $path ($label) remained HTTP $status after 12 attempts." >&2
            rm -f "$body"
            return 1
          }
          fetch_expect "/" "reverse-ledger console" "ANAS ERP — بيئة اختبار دفتر المرتجعات"
          fetch_expect "/config.js" "staging Firebase project config" '"projectId":"anas-erp-staging-a25e1"'
          fetch_expect "/config.js" "staging-only allowed origin" '"allowedOrigins":["https://anas-erp-staging-a25e1.web.app"]'
          fetch_expect "/erp/" "V42 ERP/POS shell" "Anas ERP v42"
          fetch_expect "/erp/" "ERP staging project config" '"projectId":"anas-erp-staging-a25e1"'
          fetch_expect "/erp/" "exact deployed commit and r39 build stamp" "Build SHA: ${short_sha} | SW: r39 | Env: Staging"
          fetch_expect "/erp/sw.js" "r39 service-worker cache namespace" "const CACHE = 'anas-erp-v54-25-r39';"
          fetch_expect "/erp/sw.js" "ERP offline service worker" "android-resilient-storage.js"
          fetch_expect "/erp/storage/android-resilient-storage.js" "IndexedDB resilient storage module" "IndexedDB"
          fetch_expect "/erp/sync/v42-prepared-recovery-runtime.mjs" "V42 PREPARED boot recovery runtime" "recoverPreparedMutationsOnBoot"
          fetch_expect "/erp/arabic-query-engine.js" "Arabic POS search collation" "Intl.Collator"
          echo "PASS: full staging ERP/POS PWA, offline storage assets, reverse-ledger console and staging-only Firebase configuration are live."

  live-staging-acceptance:
    needs: deploy-staging-console
    # Functions-dependent acceptance is opt-in only; normal staging pushes verify Hosting and Rules without waiting for billable Functions.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_functions_live_acceptance == true && github.ref == 'refs/heads/staging/unified-release-candidate' }}
    permissions:
      contents: read
      actions: read
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact staging candidate for live acceptance
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js 22 for live acceptance
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require successful exact-SHA Hosting deploy and HTTP verification
        env:
          HOSTING_RESULT: ${{ needs.deploy-staging-console.result }}
        run: |
          if [ "$HOSTING_RESULT" != "success" ]; then
            echo "::error::Live acceptance blocked because exact-SHA Hosting deploy or Live HTTP Verification failed."
            exit 1
          fi
          echo "ANAS_HOSTING_DEPLOY_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Wait for matching Firebase Functions deployment success
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = { authorization: 'Bearer ' + process.env.GITHUB_TOKEN, accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          for (let attempt = 1; attempt <= 100; attempt++) {
            const runsResponse = await fetch(root + '/actions/workflows/deploy-reverse-ledger-functions-staging.yml/runs?branch=' + encodeURIComponent(process.env.GITHUB_REF_NAME) + '&event=push&per_page=100', { headers });
            if (!runsResponse.ok) throw new Error('Unable to inspect Functions deployment runs: HTTP ' + runsResponse.status);
            const runs = await runsResponse.json();
            const run = (runs.workflow_runs || []).find(row => row.event === 'push' && row.head_sha === process.env.GITHUB_SHA);
            if (run?.status === 'completed') {
              const jobsResponse = await fetch(root + '/actions/runs/' + run.id + '/jobs?per_page=100', { headers });
              if (!jobsResponse.ok) throw new Error('Unable to inspect Functions deployment jobs: HTTP ' + jobsResponse.status);
              const jobs = await jobsResponse.json();
              const deploy = (jobs.jobs || []).find(job => job.name === 'deploy-reverse-ledger-staging');
              if (!deploy || deploy.conclusion !== 'success') throw new Error('Matching Functions deployment did not succeed: ' + (deploy?.conclusion || 'deploy job missing'));
              console.log('PASS: Firebase Functions deployment succeeded for exact SHA ' + process.env.GITHUB_SHA + ' (Run ID ' + run.id + ').');
              fs.appendFileSync(process.env.GITHUB_ENV, 'ANAS_FUNCTIONS_DEPLOY_VERIFIED=true\n');
              process.exit(0);
            }
            console.log('Waiting for exact-SHA Functions deployment; attempt ' + attempt + '/100.');
            await new Promise(resolve => setTimeout(resolve, 15000));
          }
          throw new Error('Timed out waiting for exact-SHA Firebase Functions deployment.');
          NODE

      - name: Live Staging Acceptance Proof — sale, fractional stock, debt, 409 and trusted backup/restore
        env:
          ANAS_STAGING_URL: https://anas-erp-staging-a25e1.web.app
          ANAS_STAGING_EMAIL: ${{ secrets.ANAS_STAGING_EMAIL }}
          ANAS_STAGING_PASSWORD: ${{ secrets.ANAS_STAGING_PASSWORD }}
          ANAS_STAGING_UID: ${{ vars.ANAS_STAGING_UID || secrets.ANAS_STAGING_UID || secrets.STAGING_TEST_UID }}
          ANAS_STAGING_E2E_FIXTURE_JSON: ${{ secrets.ANAS_STAGING_E2E_FIXTURE_JSON }}
          ANAS_STAGING_E2E_FIXTURE: ${{ runner.temp }}/anas-staging-live-e2e-fixture.json
          ANAS_STAGING_EVIDENCE_PATH: ${{ runner.temp }}/anas-staging-live-e2e-evidence.json
          ANAS_STAGING_CERTIFICATE_PATH: ${{ runner.temp }}/anas-staging-acceptance-certificate.json
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${ANAS_HOSTING_DEPLOY_VERIFIED:-}" != "true" ]; then
            echo "::error::Live financial acceptance is blocked because exact-SHA Hosting deploy and HTTP verification did not succeed."
            exit 1
          fi
          if [ "${ANAS_FUNCTIONS_DEPLOY_VERIFIED:-}" != "true" ]; then
            echo "::error::Live financial acceptance is blocked because exact-SHA Firebase Functions deployment did not succeed."
            exit 1
          fi
          for name in ANAS_STAGING_EMAIL ANAS_STAGING_PASSWORD ANAS_STAGING_E2E_FIXTURE_JSON; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing required staging Environment secret: $name"; exit 1; fi
          done
          printf '%s' "$ANAS_STAGING_E2E_FIXTURE_JSON" > "$ANAS_STAGING_E2E_FIXTURE"
          chmod 600 "$ANAS_STAGING_E2E_FIXTURE"
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateFixture } from './scripts/verify-live-staging-e2e.mjs';
          const raw = fs.readFileSync(process.env.ANAS_STAGING_E2E_FIXTURE, 'utf8');
          const fixture = JSON.parse(raw);
          if (fixture.projectId !== 'anas-erp-staging-a25e1' || /REPLACE_[A-Z0-9_]+/.test(raw)) throw new Error('Live E2E fixture must be complete and Staging-only');
          const ids = fixture.operations.map(row => row?.request?.operationId);
          if (new Set(ids).size !== ids.length || ids.some(id => typeof id !== 'string' || !/^REV-STAGE-[A-Za-z0-9._:-]{8,140}$/.test(id))) throw new Error('Live E2E operation IDs must be unique REV-STAGE identifiers');
          validateFixture(fixture);
          console.log('PASS: synthetic staging fixture validated; no production records or credentials are accepted.');
          NODE
          node --test tests/pos_full_lifecycle_chromium.test.mjs tests/micro_pos_core.test.mjs tests/customer_debt_collection_guard_test.js tests/multi_device_acceptance_protocol.test.mjs
          node scripts/verify-live-staging-e2e.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const evidence = JSON.parse(fs.readFileSync(process.env.ANAS_STAGING_EVIDENCE_PATH, 'utf8'));
          if (evidence.result !== 'PASS' || !evidence.backupRestore?.exactMatch || evidence.backupRestore.centimeDelta !== '0' || evidence.backupRestore.microUnitDelta !== '0') throw new Error('Live financial / trusted backup-restore evidence is incomplete.');
          const certificate = {
            result: 'PASS',
            testedSha: process.env.DEPLOY_SHA,
            projectId: 'anas-erp-staging-a25e1',
            serviceWorker: 'anas-erp-v54-25-r39',
            acceptance: {
              saleLifecycle: 'PASS — isolated Chromium POS lifecycle regression',
              fractionalQuantityAndExactUnits: 'PASS — Micro POS BigInt/micro-unit regression',
              customerDebtCollection: 'PASS — durable debt collection guard regression',
              twoDeviceConflict409: 'PASS — HTTP 409 CAS reconciliation regression',
              liveTrustedFinancialOperations: evidence.operations,
              liveIdempotency: evidence.idempotency,
              liveBackupRestore: evidence.backupRestore
            },
            completedAt: new Date().toISOString()
          };
          fs.writeFileSync(process.env.ANAS_STAGING_CERTIFICATE_PATH, JSON.stringify(certificate, null, 2) + '\n', { mode: 0o600 });
          console.log('ANAS_STAGING_ACCEPTANCE_CERTIFICATE ' + JSON.stringify(certificate));
          NODE

      - name: Upload exact-SHA Staging acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anas-erp-r39-staging-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/anas-staging-live-e2e-evidence.json
            ${{ runner.temp }}/anas-staging-acceptance-certificate.json
          if-no-files-found: ignore
          retention-days: 14
# 2026-11-05: retrigger isolated staging deployment after staging credential refresh.
