name: Deploy ANAS ERP Reverse Ledger Console (Staging)
# Security boundary: PRs validate without credentials; only trusted branch push or manual dispatch may deploy.
# Deployments are serialized so queued candidate pushes cannot race the dedicated Hosting site.
# The pull_request validation job is deliberately credential-free; deploy jobs remain push/dispatch-only.
# Scoped push-trigger probe: 2026-10-31 live Staging preflight.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'staging/**'
      - 'reverse-ledger/**'
      - 'firebase.staging.hosting.json'
      - '.github/workflows/deploy-reverse-ledger-console-staging.yml'
      - 'tests/**'
  push:
    branches:
      - staging/unified-release-candidate
    paths:
      - 'staging/**'
      - 'reverse-ledger/**'
      - 'firebase.staging.hosting.json'
      - '.github/workflows/deploy-reverse-ledger-console-staging.yml'
      - 'tests/**'

permissions:
  contents: read

# PR validation uses its own group so it cannot cancel or replace a queued staging deployment.
concurrency:
  group: anas-erp-reverse-ledger-console-staging-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: false

jobs:
  validate-staging-console-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'staging/unified-release-candidate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate source without deployment credentials
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate isolated hosting configuration and console sources
        run: |
          node -e "const c=require('./firebase.staging.hosting.json'); if(c.hosting.site!=='anas-erp-staging-a25e1'||c.hosting.public!=='staging-site') process.exit(1)"
          node --test tests/staging_deployment_identity_guard.test.mjs
          node --check staging/reverse-ledger-gateway.js
          node --check reverse-ledger/reverse-ledger.js

  deploy-staging-console:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging/unified-release-candidate') || (github.event_name == 'push' && github.ref == 'refs/heads/staging/unified-release-candidate')
    permissions:
      contents: read
      id-token: write
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated staging candidate
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Secret Presence Preflight (service-account JSON preferred, OIDC fallback)
        id: auth_preflight
        env:
          FIREBASE_STAGING_WEB_API_KEY: ${{ secrets.FIREBASE_STAGING_WEB_API_KEY }}
          FIREBASE_STAGING_WEB_APP_ID: ${{ secrets.FIREBASE_STAGING_WEB_APP_ID }}
          FIREBASE_STAGING_APP_CHECK_SITE_KEY: ${{ secrets.FIREBASE_STAGING_APP_CHECK_SITE_KEY }}
          DEPLOY_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT }}
          WIF_PROVIDER: ${{ vars.ANAS_STAGING_WIF_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const name of ['FIREBASE_STAGING_WEB_API_KEY','FIREBASE_STAGING_WEB_APP_ID','FIREBASE_STAGING_APP_CHECK_SITE_KEY']) {
            if (!(process.env[name] || '').trim()) { console.error('STAGING PREFLIGHT: missing ' + name); process.exit(1); }
          }
          const json = process.env.DEPLOY_SERVICE_ACCOUNT_JSON || '';
          const provider = process.env.WIF_PROVIDER || '';
          const deployer = process.env.DEPLOYER_SERVICE_ACCOUNT || '';
          if (json.trim()) {
            let credential;
            try { credential = JSON.parse(json); } catch { console.error('STAGING PREFLIGHT: invalid service-account JSON'); process.exit(1); }
            if (credential.type !== 'service_account' || credential.project_id !== 'anas-erp-staging-a25e1' || !credential.client_email || !credential.private_key) {
              console.error('STAGING PREFLIGHT: service-account JSON must belong to isolated staging'); process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'auth_mode=json\n');
            console.log('STAGING AUTH MODE: service-account JSON');
          } else if (provider && deployer) {
            if (!/^projects\/[^/]+\/locations\/global\/workloadIdentityPools\/[^/]+\/providers\/[^/]+$/.test(provider) || !/^[^@\s]+@[^@\s]+\.iam\.gserviceaccount\.com$/.test(deployer)) {
              console.error('STAGING PREFLIGHT: invalid OIDC configuration'); process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'auth_mode=oidc\n');
            console.log('STAGING AUTH MODE: OIDC fallback');
          } else {
            console.error('STAGING PREFLIGHT: provide FIREBASE_STAGING_SERVICE_ACCOUNT or both OIDC variables'); process.exit(1);
          }
          NODE

      - name: Authenticate to Firebase Staging with service-account JSON
        if: ${{ steps.auth_preflight.outputs.auth_mode == 'json' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Authenticate to Firebase Staging with GitHub OIDC fallback
        if: ${{ steps.auth_preflight.outputs.auth_mode == 'oidc' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.ANAS_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enforce staging deployment identity before any deploy action
        env:
          GCLOUD_PROJECT: anas-erp-staging-a25e1
          GOOGLE_CLOUD_PROJECT: anas-erp-staging-a25e1
          ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          configured_project="$(gcloud config get-value project 2>/dev/null || true)"
          if [ -n "$configured_project" ] && [ "$configured_project" != "(unset)" ] && [ "$configured_project" != "$GCLOUD_PROJECT" ]; then
            echo "Refusing deployment: pre-existing gcloud project differs from isolated staging."
            exit 1
          fi
          gcloud config set project "$GCLOUD_PROJECT" --quiet
          node scripts/assert-staging-deployment-identity.mjs

      - name: Build isolated staging console with staging-only Firebase config
        env:
          FIREBASE_STAGING_WEB_API_KEY: ${{ secrets.FIREBASE_STAGING_WEB_API_KEY }}
          FIREBASE_STAGING_WEB_APP_ID: ${{ secrets.FIREBASE_STAGING_WEB_APP_ID }}
          FIREBASE_STAGING_APP_CHECK_SITE_KEY: ${{ secrets.FIREBASE_STAGING_APP_CHECK_SITE_KEY }}
        run: |
          set -euo pipefail
          rm -rf staging-site
          mkdir -p staging-site/reverse-ledger
          cp staging/index.html staging-site/index.html
          cp staging/reverse-ledger-gateway.js staging-site/reverse-ledger-gateway.js
          cp reverse-ledger/reverse-ledger.js reverse-ledger/reverse-ledger-modal.js staging-site/reverse-ledger/
          sed -i 's#../reverse-ledger/#./reverse-ledger/#g' staging-site/index.html
          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            firebaseConfig: {
              apiKey: process.env.FIREBASE_STAGING_WEB_API_KEY,
              authDomain: 'anas-erp-staging-a25e1.firebaseapp.com',
              projectId: 'anas-erp-staging-a25e1',
              appId: process.env.FIREBASE_STAGING_WEB_APP_ID
            },
            appCheckSiteKey: process.env.FIREBASE_STAGING_APP_CHECK_SITE_KEY,
            allowedOrigins: ['https://anas-erp-staging-a25e1.web.app'],
            functionsRegion: 'us-central1'
          };
          for (const [key, value] of Object.entries({
            apiKey: config.firebaseConfig.apiKey,
            appId: config.firebaseConfig.appId,
            appCheckSiteKey: config.appCheckSiteKey
          })) {
            if (typeof value !== 'string' || !value.trim() || value.length > 512) {
              throw new Error('Invalid staging public config field: ' + key);
            }
          }
          fs.writeFileSync('staging-site/config.js',
            'window.ANAS_REVERSE_LEDGER_STAGING_CONFIG = ' + JSON.stringify(config) + ';\n',
            { mode: 0o600 });
          NODE
          test -f staging-site/index.html
          test -f staging-site/config.js
          test -f staging-site/reverse-ledger-gateway.js
          test -f staging-site/reverse-ledger/reverse-ledger.js
          ! grep -q 'projectId:"anas-erb"' staging-site/config.js
          grep -q 'anas-erp-staging-a25e1' staging-site/config.js
          grep -q './reverse-ledger/reverse-ledger.js' staging-site/index.html
          grep -q 'noindex,nofollow' staging-site/index.html

      - name: Validate isolated hosting configuration
        run: |
          node -e "const c=require('./firebase.staging.hosting.json'); if(c.hosting.site!=='anas-erp-staging-a25e1'||c.hosting.public!=='staging-site') process.exit(1)"
          node --check staging-site/config.js
          node --check staging-site/reverse-ledger-gateway.js

      - name: Deploy only the dedicated staging console
        run: npx --yes firebase-tools@14.22.0 deploy --only hosting --config firebase.staging.hosting.json --project anas-erp-staging-a25e1 --non-interactive

      - name: Verify live staging console and public config scope
        env:
          STAGING_ORIGIN: https://anas-erp-staging-a25e1.web.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$STAGING_ORIGIN/" | grep -q 'ANAS ERP — بيئة اختبار دفتر المرتجعات'
          curl --fail --silent --show-error "$STAGING_ORIGIN/config.js" | grep -q '"projectId":"anas-erp-staging-a25e1"'
          curl --fail --silent --show-error "$STAGING_ORIGIN/config.js" | grep -Fq '"allowedOrigins":["https://anas-erp-staging-a25e1.web.app"]'
          echo "PASS: dedicated staging console and staging-only public Firebase configuration are live."
