name: Deploy ANAS ERP Reverse Ledger Console (Staging)
# Security boundary: PRs validate without credentials; only trusted branch push or manual dispatch may deploy.
# Deployments are serialized so queued candidate pushes cannot race the dedicated Hosting site.
# The pull_request validation job is deliberately credential-free; deploy jobs remain push/dispatch-only.
# Shared staging credential preflight accepts V2 raw JSON or Base64 and validates the staging project before auth.
# Scoped push-trigger probe: 2026-10-31 live Staging preflight.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'staging/**'
      - 'scripts/prepare-staging-service-account.mjs'
      - 'reverse-ledger/**'
      - 'firebase.staging.hosting.json'
      - '.github/workflows/deploy-reverse-ledger-console-staging.yml'
      - 'tests/**'
  push:
    branches:
      - staging/unified-release-candidate
    paths:
      - 'staging/**'
      - 'scripts/prepare-staging-service-account.mjs'
      - 'reverse-ledger/**'
      - 'firebase.staging.hosting.json'
      - '.github/workflows/deploy-reverse-ledger-console-staging.yml'
      - 'tests/**'

permissions:
  contents: read

# PR validation uses its own group so it cannot cancel or replace a queued staging deployment.
concurrency:
  group: anas-erp-reverse-ledger-console-staging-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: false

jobs:
  validate-staging-console-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'staging/unified-release-candidate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate source without deployment credentials
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate isolated hosting configuration and console sources
        run: |
          node -e "const c=require('./firebase.staging.hosting.json'); if(c.hosting.site!=='anas-erp-staging-a25e1'||c.hosting.public!=='staging-site') process.exit(1)"
          node --check scripts/assert-staging-deployment-identity.mjs
          node --check tests/staging_deployment_identity_guard.test.mjs
          node --test tests/staging_deployment_identity_guard.test.mjs tests/staging_service_account_preflight.test.mjs
          node --check staging/reverse-ledger-gateway.js
          node --check reverse-ledger/reverse-ledger.js

  deploy-staging-console:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging/unified-release-candidate') || (github.event_name == 'push' && github.ref == 'refs/heads/staging/unified-release-candidate')
    permissions:
      contents: read
      id-token: write
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated staging candidate
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Secret Presence Preflight (raw JSON or Base64 service-account, OIDC fallback)
        id: auth_preflight
        env:
          FIREBASE_STAGING_WEB_API_KEY: ${{ secrets.FIREBASE_STAGING_WEB_API_KEY }}
          FIREBASE_STAGING_WEB_APP_ID: ${{ secrets.FIREBASE_STAGING_WEB_APP_ID }}
          FIREBASE_STAGING_APP_CHECK_SITE_KEY: ${{ secrets.FIREBASE_STAGING_APP_CHECK_SITE_KEY }}
          DEPLOY_SERVICE_ACCOUNT_INPUT: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT || secrets.FIREBASE_STAGING_SERVICE_ACCOUNT_V2 }}
          WIF_PROVIDER: ${{ vars.ANAS_STAGING_WIF_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          node -e "for (const name of ['FIREBASE_STAGING_WEB_API_KEY','FIREBASE_STAGING_WEB_APP_ID']) if (!(process.env[name] || '').trim()) { console.error('STAGING PREFLIGHT: missing ' + name); process.exit(1); }"
          node scripts/prepare-staging-service-account.mjs
      - name: Authenticate to Firebase Staging with service-account JSON
        if: ${{ steps.auth_preflight.outputs.auth_mode == 'json' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.STAGING_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true

      - name: Authenticate to Firebase Staging with GitHub OIDC fallback
        if: ${{ steps.auth_preflight.outputs.auth_mode == 'oidc' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.ANAS_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enforce staging deployment identity before any deploy action
        env:
          FIREBASE_PROJECT_ID: anas-erp-staging-a25e1
          GCLOUD_PROJECT: anas-erp-staging-a25e1
          GOOGLE_CLOUD_PROJECT: anas-erp-staging-a25e1
          ANAS_STAGING_WIF_PROVIDER: ${{ vars.ANAS_STAGING_WIF_PROVIDER }}
          ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.ANAS_STAGING_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          configured_project="$(gcloud config get-value project 2>/dev/null || true)"
          if [ -n "$configured_project" ] && [ "$configured_project" != "(unset)" ] && [ "$configured_project" != "$GCLOUD_PROJECT" ]; then
            echo "Refusing deployment: pre-existing gcloud project differs from isolated staging."
            exit 1
          fi
          gcloud config set project "$GCLOUD_PROJECT" --quiet
          node scripts/assert-staging-deployment-identity.mjs

      - name: Build full ERP/POS PWA and isolated reverse-ledger console
        env:
          FIREBASE_STAGING_WEB_API_KEY: ${{ secrets.FIREBASE_STAGING_WEB_API_KEY }}
          FIREBASE_STAGING_WEB_APP_ID: ${{ secrets.FIREBASE_STAGING_WEB_APP_ID }}
          FIREBASE_STAGING_APP_CHECK_SITE_KEY: ${{ secrets.FIREBASE_STAGING_APP_CHECK_SITE_KEY }}
        run: node scripts/build-staging-hosting.mjs

      - name: Validate isolated hosting configuration
        run: |
          node -e "const c=require('./firebase.staging.hosting.json'); if(c.hosting.site!=='anas-erp-staging-a25e1'||c.hosting.public!=='staging-site') process.exit(1)"
          node --check staging-site/config.js
          node --check staging-site/reverse-ledger-gateway.js
          test -f staging-site/erp/index.html
          test -f staging-site/erp/sw.js
          test -f staging-site/erp/storage/android-resilient-storage.js
          test -f staging-site/erp/manifest.webmanifest
          ! grep -q 'projectId:"anas-erb"' staging-site/erp/index.html
          grep -q 'projectId":"anas-erp-staging-a25e1' staging-site/erp/index.html

      - name: Deploy only the dedicated staging ERP and console
        run: npx --yes firebase-tools@14.22.0 deploy --only hosting --config firebase.staging.hosting.json --project anas-erp-staging-a25e1 --non-interactive

      - name: Verify live staging ERP, offline assets, console and public config scope
        env:
          STAGING_ORIGIN: https://anas-erp-staging-a25e1.web.app
        run: |
          set -euo pipefail
          fetch_expect() {
            local path="$1" label="$2" pattern="$3" body status attempt
            body="$(mktemp)"
            status="000"
            for attempt in $(seq 1 12); do
              status="$(curl --location --silent --show-error --output "$body" --write-out '%{http_code}' "$STAGING_ORIGIN$path" 2>/dev/null || true)"
              if [ "$status" = "200" ]; then
                if grep -Fq "$pattern" "$body"; then
                  rm -f "$body"
                  echo "PASS: $label"
                  return 0
                fi
                echo "STAGING VERIFY: HTTP 200 but expected content missing at $path ($label)." >&2
                rm -f "$body"
                return 1
              fi
              sleep 5
            done
            echo "STAGING VERIFY: $path ($label) remained HTTP $status after 12 attempts." >&2
            rm -f "$body"
            return 1
          }
          fetch_expect "/" "reverse-ledger console" "ANAS ERP — بيئة اختبار دفتر المرتجعات"
          fetch_expect "/config.js" "staging Firebase project config" '"projectId":"anas-erp-staging-a25e1"'
          fetch_expect "/config.js" "staging-only allowed origin" '"allowedOrigins":["https://anas-erp-staging-a25e1.web.app"]'
          fetch_expect "/erp/" "V42 ERP/POS shell" "Anas ERP v42"
          fetch_expect "/erp/" "ERP staging project config" '"projectId":"anas-erp-staging-a25e1"'
          fetch_expect "/erp/sw.js" "ERP offline service worker" "android-resilient-storage.js"
          fetch_expect "/erp/storage/android-resilient-storage.js" "IndexedDB resilient storage module" "IndexedDB"
          echo "PASS: full staging ERP/POS PWA, offline storage assets, reverse-ledger console and staging-only Firebase configuration are live."
# 2026-11-05: retrigger isolated staging deployment after staging credential refresh.
