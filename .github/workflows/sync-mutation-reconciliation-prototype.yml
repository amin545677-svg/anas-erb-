name: Sync Mutation Reconciliation Prototype

on:
  pull_request:
    paths:
      - 'sync/mutation_reconciliation.mjs'
      - 'sync/mutation_capture.mjs'
      - 'sync/mutation_keys.mjs'
      - 'sync/mutation_queue_orchestrator.mjs'
      - 'sync/v42_transactional_bridge.mjs'
      - 'sync/v42_runtime_installer.mjs'
      - 'docs/v42-sync-entrypoint-audit.md'
      - 'sync/firebase_snapshot_transport.mjs'
      - 'tests/sync_mutation_queue_orchestrator.test.mjs'
      - 'tests/mutation_capture.test.mjs'
      - 'tests/sync_mutation_reconciliation.test.mjs'
      - 'tests/v42_schema_parity.test.mjs'
      - 'tests/v42_transactional_capture_integration.test.mjs'
      - 'tests/v42_transactional_bridge.test.mjs'
      - 'tests/v42_pre_sync_recovery_barrier.test.mjs'
      - 'tests/v42_runtime_installer.test.mjs'
      - 'tests/v42_runtime_installer_failure.test.mjs'
      - 'tests/firebase_snapshot_transport.test.mjs'
      - 'tests/firebase_snapshot_e2e_mock.test.mjs'
      - 'index.html'
      - '.github/workflows/sync-mutation-reconciliation-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation-prototype:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated reconciliation, queue lifecycle, V42 parity, and Firebase transport
        run: node --test tests/v42_runtime_installer_failure.test.mjs tests/v42_runtime_installer.test.mjs tests/v42_pre_sync_recovery_barrier.test.mjs tests/v42_transactional_bridge.test.mjs tests/v42_transactional_capture_integration.test.mjs tests/mutation_capture.test.mjs tests/sync_mutation_reconciliation.test.mjs tests/sync_mutation_queue_orchestrator.test.mjs tests/v42_schema_parity.test.mjs tests/firebase_snapshot_transport.test.mjs tests/firebase_snapshot_e2e_mock.test.mjs
