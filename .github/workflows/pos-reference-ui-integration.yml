name: POS Reference UI Integration
on:
  push:
    branches: [staging/unified-release-candidate]
    paths:
      - "scripts/apply-pos-reference-ui.mjs"
      - ".github/workflows/pos-reference-ui-integration.yml"
permissions:
  contents: write
jobs:
  integrate-and-test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/unified-release-candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Apply POS presentation directly to index.html
        run: node scripts/apply-pos-reference-ui.mjs
      - name: Install Chromium runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run actual ERP POS lifecycle in Chromium
        run: node --test tests/pos_full_lifecycle_chromium.test.mjs
      - name: Validate HTML and financial safety
        run: python tests/validate_erp_html.py
      - name: Commit integrated index.html only after all tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          if git diff --cached --quiet; then echo "No HTML changes"; exit 0; fi
          git commit -m "feat(pos): integrate reference product cards into ERP [skip ci]"
          git push origin HEAD:staging/unified-release-candidate
