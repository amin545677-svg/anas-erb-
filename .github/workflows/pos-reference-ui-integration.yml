name: POS Reference UI Integration
on:
  push:
    branches: [staging/unified-release-candidate]
    paths:
      - "scripts/apply-pos-reference-ui.mjs"
      - "arabic-query-engine.js"
      - "tests/arabic-query-engine.test.mjs"
      - ".github/workflows/pos-reference-ui-integration.yml"
      - "tests/pos_full_lifecycle_chromium.test.mjs"
permissions:
  contents: write
jobs:
  integrate-and-test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/unified-release-candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Integrate, test and push with fast-forward race recovery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "POS integration attempt \${attempt}/3"
            git fetch origin staging/unified-release-candidate
            git reset --hard FETCH_HEAD
            node scripts/apply-pos-reference-ui.mjs
            node --test tests/pos_full_lifecycle_chromium.test.mjs
            python tests/validate_erp_html.py
            git add index.html
            git diff --cached --check
            if git diff --cached --quiet; then
              echo "POS reference UI is already present and all acceptance tests passed."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat(pos): integrate reference product cards into ERP [skip ci]"
            if git push origin HEAD:staging/unified-release-candidate; then
              echo "Integrated index.html pushed successfully."
              exit 0
            fi
            echo "Remote branch moved during push; retrying from its latest head."
          done
          echo "Could not publish after three fast-forward retries."
          exit 1
