name: Workflow YAML Syntax Validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  yaml-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Parse every workflow YAML file
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").sort.each { |path| YAML.parse_file(path); puts "YAML syntax OK: #{path}" }'
