name: ANAS ERP Android Native Checks

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-native-checks.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-native-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Android app
        working-directory: android
        run: gradle assembleDebug
      - name: Run unit tests
        working-directory: android
        run: gradle testDebugUnitTest
