name: Deploy and Verify ANAS ERP Firebase Staging Worker

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/atomic-reverse-ledger"
    paths:
      - ".github/workflows/deploy-firebase-staging-worker.yml"
      - "cloudflare/wrangler-staging.toml"
      - "cloudflare/worker_firebase_snapshot.js"
      - "tests/worker_firebase_snapshot.test.mjs"

permissions:
  contents: read

jobs:
  deploy-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Worker and staging isolation contract
        run: node --test tests/worker_firebase_snapshot.test.mjs

      - name: Validate staging deployment configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          config = Path("cloudflare/wrangler-staging.toml").read_text(encoding="utf-8")
          required = [
              'name = "anas-erp-firebase-snapshot-staging"',
              'FIREBASE_PROJECT_ID = "anas-erp-staging-a25e1"',
              'ALLOWED_ORIGINS = "https://anas-erp-staging-a25e1.web.app,https://anas-erp-staging-a25e1.firebaseapp.com"',
              'required = ["FIREBASE_API_KEY"]'
          ]
          missing = [value for value in required if value not in config]
          if missing:
              raise SystemExit("Staging config is incomplete: " + repr(missing))
          if "anas-erb" in config or "amin545677-svg.github.io" in config:
              raise SystemExit("Refusing to deploy staging config containing production project/origin")
          print("Staging Worker identity, Firebase project, origins and secret contract verified.")
          PY

      - name: Require isolated staging credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_STAGING_API_KEY: ${{ secrets.FIREBASE_STAGING_API_KEY }}
          FIREBASE_STAGING_TEST_EMAIL: ${{ secrets.FIREBASE_STAGING_TEST_EMAIL }}
          FIREBASE_STAGING_TEST_PASSWORD: ${{ secrets.FIREBASE_STAGING_TEST_PASSWORD }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FIREBASE_STAGING_API_KEY FIREBASE_STAGING_TEST_EMAIL FIREBASE_STAGING_TEST_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required staging secrets:$missing"
            exit 1
          fi
          echo "All dedicated staging credentials are present."

      - name: Deploy isolated staging Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_STAGING_API_KEY: ${{ secrets.FIREBASE_STAGING_API_KEY }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --config wrangler-staging.toml 2>&1 | tee /tmp/anas-staging-deploy.log
          echo "$FIREBASE_STAGING_API_KEY" | npx --yes wrangler@4 secret put FIREBASE_API_KEY --config wrangler-staging.toml
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/anas-staging-deploy.log | tail -n 1)"
          test -n "$WORKER_URL" || (echo "::error::Could not resolve the staging workers.dev URL from Wrangler output." && exit 1)
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          echo "Staging Worker URL resolved and deployment secret configured."

      - name: Verify staging health endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Origin: https://anas-erp-staging-a25e1.web.app" \
            "$WORKER_URL/health" > /tmp/anas-staging-health.json
          jq -e '
            .ok == true and
            .service == "anas-erp-firebase-snapshot-staging" and
            .projectId == "anas-erp-staging-a25e1" and
            .configured == true
          ' /tmp/anas-staging-health.json
          echo "Staging /health confirms the isolated project and configured secret."

      - name: Authenticate dedicated staging test user
        env:
          FIREBASE_STAGING_API_KEY: ${{ secrets.FIREBASE_STAGING_API_KEY }}
          FIREBASE_STAGING_TEST_EMAIL: ${{ secrets.FIREBASE_STAGING_TEST_EMAIL }}
          FIREBASE_STAGING_TEST_PASSWORD: ${{ secrets.FIREBASE_STAGING_TEST_PASSWORD }}
        run: |
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg email "$FIREBASE_STAGING_TEST_EMAIL" --arg password "$FIREBASE_STAGING_TEST_PASSWORD" '{email:$email,password:$password,returnSecureToken:true}')" \
            "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$FIREBASE_STAGING_API_KEY" > /tmp/anas-staging-auth.json
          TOKEN="$(jq -r '.idToken // empty' /tmp/anas-staging-auth.json)"
          test -n "$TOKEN" || (echo "::error::Firebase staging test account authentication failed." && exit 1)
          echo "::add-mask::$TOKEN"
          echo "FIREBASE_STAGING_ID_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Dedicated staging test user authenticated."

      - name: Verify authenticated snapshot read, create, conflict and restore
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const base = process.env.WORKER_URL;
          const token = process.env.FIREBASE_STAGING_ID_TOKEN;
          const origin = 'https://anas-erp-staging-a25e1.web.app';
          const headers = { Origin: origin, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
          const baseline = JSON.stringify({ products: [], customers: [] });
          const smoke = JSON.stringify({ products: [{ id: 'STAGING-SMOKE-PRODUCT', stock: 1 }], customers: [] });
          async function getSnapshot() {
            const response = await fetch(base + '/snapshot', { headers });
            const body = await response.json();
            assert.equal(response.status, 200, 'authenticated snapshot read must succeed');
            assert.equal(body.ok, true);
            return body;
          }
          async function writeSnapshot(data, revision, method = 'POST') {
            return fetch(base + '/snapshot', {
              method, headers, body: JSON.stringify({ data, revision })
            });
          }
          (async () => {
            const initial = await getSnapshot();
            if (initial.exists && initial.data !== baseline) {
              throw new Error('Refusing to overwrite a non-empty staging test-user snapshot.');
            }
            const originalRevision = initial.exists ? initial.revision : null;
            const created = await writeSnapshot(smoke, originalRevision, 'POST');
            assert.equal(created.status, 200, 'staging snapshot create/update must succeed');
            const createdBody = await created.json();
            assert.equal(createdBody.saved, true);
            assert.ok(createdBody.revision, 'Firestore must return a committed updateTime');

            const readBack = await getSnapshot();
            assert.equal(readBack.exists, true);
            assert.equal(readBack.data, smoke, 'read-after-write must return the exact snapshot');

            const stale = await writeSnapshot(smoke, originalRevision, 'POST');
            assert.equal(stale.status, 409, 'stale/create-only revision must be rejected');

            const restored = await writeSnapshot(baseline, readBack.revision, 'PUT');
            assert.equal(restored.status, 200, 'baseline restore must succeed using the latest revision');
            const finalState = await getSnapshot();
            assert.equal(finalState.exists, true);
            assert.equal(finalState.data, baseline, 'test account snapshot must be restored to the empty baseline');
            console.log('PASS: authenticated staging read/write, optimistic conflict rejection, and baseline restore.');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
