name: Deploy ANAS ERP OpenAI AI Worker

on:
  # OpenAI Worker deployment requires explicit manual action after review.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Add repository secret CLOUDFLARE_API_TOKEN first." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Add repository secret CLOUDFLARE_ACCOUNT_ID first." && exit 1)
          test -n "$OPENAI_API_KEY" || (echo "::error::Add repository secret OPENAI_API_KEY first." && exit 1)
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check OpenAI Worker JavaScript syntax
        run: node --check cloudflare/worker_openai_ai.js
      - name: Deploy separate OpenAI AI Worker
        uses: cloudflare/wrangler-action@v3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          workingDirectory: cloudflare
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-openai.toml
          secrets: |
            OPENAI_API_KEY
