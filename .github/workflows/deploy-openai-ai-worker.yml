name: Deploy ANAS ERP OpenAI AI Worker

on:
  # Keep manual deployment available.
  workflow_dispatch:
  # Deploy reviewed Worker/config changes after they reach main.
  push:
    branches:
      - main
    paths:
      - "cloudflare/worker_openai_ai.js"
      - "cloudflare/wrangler-openai.toml"
      - ".github/workflows/deploy-openai-ai-worker.yml"

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Add repository secret CLOUDFLARE_API_TOKEN first." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Add repository secret CLOUDFLARE_ACCOUNT_ID first." && exit 1)
          test -n "$OPENAI_API_KEY" || (echo "::error::Add repository secret OPENAI_API_KEY first." && exit 1)
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check OpenAI Worker JavaScript syntax
        run: node --check cloudflare/worker_openai_ai.js
      - name: Verify Cloudflare token and account access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          token_success="$(printf '%s' "$token_response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.success===true?"true":"false");if(j.success!==true)for(const e of j.errors||[])console.error("Cloudflare token verification:",e.code||"",e.message||"request rejected")}catch{console.log("false");console.error("Cloudflare token verification returned invalid JSON")}})')"
          if [ "$token_success" != "true" ]; then
            echo "::error::Cloudflare rejected CLOUDFLARE_API_TOKEN. Create/activate a valid token and update the GitHub repository secret."
            exit 1
          fi
          echo "Cloudflare token is active."
          account_response="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")"
          account_success="$(printf '%s' "$account_response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.success===true?"true":"false");if(j.success!==true)for(const e of j.errors||[])console.error("Cloudflare account access:",e.code||"",e.message||"request rejected")}catch{console.log("false");console.error("Cloudflare account check returned invalid JSON")}})')"
          if [ "$account_success" != "true" ]; then
            echo "::error::Token verification passed, but the configured Cloudflare account could not be read. Check CLOUDFLARE_ACCOUNT_ID and grant Account Settings: Read for the matching account."
            exit 1
          fi
          echo "Cloudflare account access verified. Worker deployment will now test the Workers Scripts permission."
      - name: Deploy separate OpenAI AI Worker
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: cloudflare
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-openai.toml
      - name: Set OpenAI API key on the intended Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          printf '%s' "$OPENAI_API_KEY" | npx --yes wrangler@3.90.0 secret put OPENAI_API_KEY --config wrangler-openai.toml
