name: ANAS ERP HTML Regression Checks

on:
  pull_request:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "anas-classic-ui.css"
      - "tests/validate_erp_html.py"
      - "tests/test_classic_ui.py"
      - "tests/test_classic_ui_browser.py"
      - ".github/workflows/anas-erp-html-checks.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "anas-classic-ui.css"
      - "tests/validate_erp_html.py"
      - "tests/test_classic_ui.py"
      - ".github/workflows/anas-erp-html-checks.yml"

permissions:
  contents: read

jobs:
  static-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ANAS ERP HTML and inline JavaScript
        run: python tests/validate_erp_html.py
      - name: Validate classic UI stylesheet and responsive theme contracts
        run: python tests/test_classic_ui.py
      - name: Install isolated Chromium browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run responsive Chromium and drawer smoke tests
        run: python tests/test_classic_ui_browser.py
