name: ANAS ERP HTML Regression Checks

on:
  pull_request:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/validate_erp_html.py"
      - ".github/workflows/anas-erp-html-checks.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/validate_erp_html.py"
      - ".github/workflows/anas-erp-html-checks.yml"

permissions:
  contents: read

jobs:
  static-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ANAS ERP HTML and inline JavaScript
        run: python tests/validate_erp_html.py
