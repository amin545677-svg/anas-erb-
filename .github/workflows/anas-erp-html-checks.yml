name: ANAS ERP HTML Regression Checks

on:
  pull_request:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/validate_erp_html.py"
      - "tests/ai_prompt_dom_trace.mjs"
      - "tests/test_diagnostic_preview_server.py"
      - "tools/serve_ai_diagnostic_preview.py"
      - ".github/workflows/anas-erp-html-checks.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/validate_erp_html.py"
      - "tests/test_diagnostic_preview_server.py"
      - "tools/serve_ai_diagnostic_preview.py"
      - ".github/workflows/anas-erp-html-checks.yml"

permissions:
  contents: read

jobs:
  static-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ANAS ERP HTML and inline JavaScript
        run: python tests/validate_erp_html.py
      - name: Test restricted diagnostic preview server
        run: python -m unittest tests/test_diagnostic_preview_server.py

  isolated-browser-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run local-only DOM trace
        run: node tests/ai_prompt_dom_trace.mjs
      - name: Upload redacted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-prompt-dom-trace
          path: artifacts/ai-prompt-trace.json
          if-no-files-found: warn
          retention-days: 7
