name: ANAS ERP HTML Regression Checks

on:
  pull_request:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/validate_erp_html.py"
      - "reverse-ledger/**"
      - "tests/reverse_ledger_primitives.test.js"
      - "tests/reverse_ledger_authorization.test.js"
      - "tests/reverse_ledger_valuation.test.js"
      - "cloudflare/worker_reverse_ledger.js"
      - "cloudflare/wrangler-reverse-ledger-staging.toml"
      - "tests/worker_reverse_ledger.test.mjs"
      - "firebase/firestore.rules"
      - ".github/workflows/anas-erp-html-checks.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/validate_erp_html.py"
      - ".github/workflows/anas-erp-html-checks.yml"

permissions:
  contents: read

jobs:
  static-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ANAS ERP HTML and inline JavaScript
        run: python tests/validate_erp_html.py
      - name: Test reverse-ledger schemas and allocation invariants
        run: node --test tests/reverse_ledger_primitives.test.js
      - name: Test reverse-ledger authorization policy gates
        run: node --test tests/reverse_ledger_authorization.test.js
      - name: Test cumulative and WAC reverse-ledger valuation
        run: node --test tests/reverse_ledger_valuation.test.js
      - name: Check trusted reverse-ledger reservation Worker syntax
        run: node --check cloudflare/worker_reverse_ledger.js
      - name: Test trusted reverse-ledger reservation Worker security
        run: node --test tests/worker_reverse_ledger.test.mjs
