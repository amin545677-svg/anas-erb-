name: Staging Test Gate

on:
  pull_request:
    paths:
      - "index.html"
      - "tests/**"
      - "functions/**"
      - "reverse-ledger/**"
      - "staging/**"
      - "staging/**"
      - "firebase.staging.json"
      - "firebase/firestore.staging.rules"
      - ".github/workflows/staging-test-gate.yml"
  push:
    branches: [staging/firebase-snapshot-worker, 'feat/**', 'fix/**']
    paths:
      - "index.html"
      - "tests/**"
      - "functions/**"
      - "reverse-ledger/**"
      - "staging/**"
      - "firebase.staging.json"
      - "firebase/firestore.staging.rules"
      - "firebase/firestore.reverse-ledger.rules"
      - "cloudflare/worker_reverse_ledger.js"
      - ".github/workflows/staging-test-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging candidate
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java for the Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run Hasib financial and stock invariants
        run: node --test tests/hasib_sale_ledger_parity_test.js tests/customer_debt_collection_guard_test.js tests/expense_ledger_id_integrity_test.js tests/purchase_supplier_centime_ledger_test.js tests/reverse_ledger_primitives.test.js tests/reverse_ledger_rollback_identity.test.js
      - name: Verify deployable Functions bundle matches canonical ledger modules
        run: |
          cmp reverse-ledger/reverse-ledger.js functions/lib/reverse-ledger.js
          cmp reverse-ledger/authorization.js functions/lib/authorization.js
          node --check functions/index.js
          node --check functions/reverse-ledger-adapter.js
          node --check functions/reverse-ledger-service.js
          node --check functions/reverse-ledger-backup-service.js
      - name: Install and load the Firebase Functions runtime package
        run: |
          npm install --prefix functions --omit=dev --no-audit --no-fund
          GCLOUD_PROJECT=anas-erp-staging-a25e1 node -e "const f=require('./functions'); if(typeof f.executeReverseLedger!=='function'||typeof f.createTrustedReverseLedgerBackup!=='function'||typeof f.restoreTrustedReverseLedgerBackup!=='function') process.exit(1); console.log('Firebase reverse-ledger and trusted backup callables loaded.');"
      - name: Run staging Firebase callable client tests
        run: node --test tests/reverse_ledger_firebase_callable_client.test.cjs
      - name: Run trusted reverse-ledger authorization, server adapter and reservation Worker tests
        run: node --test tests/reverse_ledger_authorization.test.js tests/reverse_ledger_server_adapter.test.js tests/reverse_ledger_server_transaction.test.js tests/worker_reverse_ledger.test.mjs
      - name: Install Firestore Rules emulator test dependencies
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@4.0.1 firebase@11.0.2
      - name: Run real Firestore Emulator transaction, concurrency and security-rules tests
        run: npx --yes firebase-tools@14.22.0 emulators:exec --only firestore --project demo-anas-erp --config firebase.staging.json "node --test tests/reverse_ledger_firestore_emulator.test.js && node --test tests/reverse_ledger_snapshot_rules.test.mjs"
      - name: Syntax-check Chromium behavioral tests
        run: node --check tests/purchase_supplier_chromium_staging.test.mjs && node --check tests/reverse_ledger_chromium.test.mjs
      - name: Install Playwright for real browser verification
        run: npm install --no-save playwright@1.56.1
      - name: Install headless Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run real DOM purchase, supplier settlement, reload and backup restore
        run: node --test tests/purchase_supplier_chromium_staging.test.mjs tests/reverse_ledger_chromium.test.mjs
      - name: Validate full ERP HTML and inline JavaScript
        run: |
          python -m py_compile tests/validate_erp_html.py
          python tests/validate_erp_html.py
