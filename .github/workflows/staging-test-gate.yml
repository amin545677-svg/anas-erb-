name: Staging Test Gate

on:
  pull_request:
    branches:
      - staging/firebase-snapshot-worker
    paths:
      - "index.html"
      - "tests/**"
      - ".github/workflows/staging-test-gate.yml"
  push:
    branches:
      - staging/firebase-snapshot-worker
    paths:
      - "index.html"
      - "tests/**"
      - ".github/workflows/staging-test-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging candidate
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Hasib financial and stock invariants
        run: node --test tests/hasib_sale_ledger_parity_test.js tests/customer_debt_collection_guard_test.js tests/expense_ledger_id_integrity_test.js tests/purchase_supplier_centime_ledger_test.js
      - name: Install Playwright for real browser verification
        run: npm install --no-save playwright@1.56.1
      - name: Install headless Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run real DOM purchase, supplier settlement, reload and backup restore
        run: node --test tests/purchase_supplier_chromium_staging.test.mjs
      - name: Validate full ERP HTML and inline JavaScript
        run: |
          python -m py_compile tests/validate_erp_html.py
          python tests/validate_erp_html.py
