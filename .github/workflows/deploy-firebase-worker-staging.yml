name: Deploy ANAS ERP Firebase Snapshot Worker (Staging)

# Staging-only deployment. Never mutate the production Worker from this workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - staging/firebase-snapshot-worker
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-firebase-worker-staging.yml'

permissions:
  contents: read

# Serialize deployments to prevent push/PR races against the same Cloudflare Worker.
concurrency:
  group: anas-erp-firebase-snapshot-staging
  cancel-in-progress: false

jobs:
  deploy-staging-worker:
    if: github.head_ref == 'staging/firebase-snapshot-worker' || github.ref_name == 'staging/firebase-snapshot-worker'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Firebase snapshot Worker before staging deployment
        run: node --test tests/worker_firebase_snapshot.test.mjs

      - name: Check staging deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Add CLOUDFLARE_API_TOKEN as a GitHub Actions secret." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Add CLOUDFLARE_ACCOUNT_ID as a GitHub Actions secret." && exit 1)
          test -n "$STAGING_FIREBASE_API_KEY" || (echo "::error::Add STAGING_FIREBASE_API_KEY as a GitHub Actions secret." && exit 1)

      - name: Deploy isolated staging Worker with explicit config and name
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.0 deploy \
            --config cloudflare/wrangler-staging.toml \
            --name anas-erp-firebase-snapshot-staging

      - name: Inject Secret Strictly to Staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          CLEAN_KEY="$(node --input-type=module <<'NODE'
          const rawKey = process.env.STAGING_FIREBASE_API_KEY || "";
          const cleanKey = rawKey.replace(/["'\s\r\n]/g, "");
          console.error(`Key Diagnostic -> Raw Length: ${rawKey.length}, Clean Length: ${cleanKey.length}, StartsWith AIza: ${cleanKey.startsWith("AIza")}`);
          if (!/^AIza[0-9A-Za-z_-]+$/.test(cleanKey)) {
            throw new Error("Staging Firebase API key has an invalid Web API key shape; value withheld.");
          }
          process.stdout.write(cleanKey);
          NODE
          )"
          test -n "$CLEAN_KEY"
          echo "::add-mask::$CLEAN_KEY"
          VERSION_TAG="staging-secret-${GITHUB_SHA:0:12}"
          printf '%s' "$CLEAN_KEY" | npx --yes wrangler@4.156.0 versions secret put FIREBASE_API_KEY \
            --config cloudflare/wrangler-staging.toml \
            --name anas-erp-firebase-snapshot-staging \
            --tag "$VERSION_TAG" \
            --message "Staging Firebase secret for ${GITHUB_SHA:0:12}"
          npx --yes wrangler@4.156.0 versions deploy \
            --config cloudflare/wrangler-staging.toml \
            --name anas-erp-firebase-snapshot-staging \
            --version-tag "$VERSION_TAG" \
            --yes

      - name: Post-Deploy Live Smoke Test and Auth Guard
        env:
          WORKER_BASE_URL: https://anas-erp-firebase-snapshot-staging.amin545677.workers.dev
          EXPECTED_ORIGIN: https://amin545677-svg.github.io
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.WORKER_BASE_URL;
          const origin = process.env.EXPECTED_ORIGIN;
          const check = (ok, message) => { if (!ok) throw new Error(message); };
          const call = (path, options = {}) => fetch(base + path, { ...options, headers: { Origin: origin, ...(options.headers || {}) } });
          const health = await call('/health');
          const data = await health.json();
          check(health.status === 200, 'health status=' + health.status);
          check(health.headers.get('access-control-allow-origin') === origin, 'CORS origin mismatch');
          check((health.headers.get('cache-control') || '').toLowerCase() === 'no-store', 'cache-control mismatch');
          check(data.ok === true && data.service === 'anas-erp-firebase-snapshot-staging' && data.projectId === 'anas-erp-staging-a25e1' && data.configured === true, 'health JSON mismatch');
          console.log('PASS LIVE HEALTH: HTTP 200, CORS, no-store and expected Staging JSON.');
          for (const method of ['GET', 'PUT']) {
            const response = await call('/snapshot', { method });
            check(response.status === 401, method + ' missing token returned ' + response.status);
            console.log('PASS AUTH GUARD: ' + method + ' without token -> 401.');
          }
          for (const method of ['GET', 'PUT']) {
            const response = await call('/snapshot', {
              method,
              headers: { Authorization: 'Bearer invalid-token-123', 'Content-Type': 'application/json' },
              body: method === 'PUT' ? JSON.stringify({ data: '{"products":[],"customers":[]}' }) : undefined,
            });
            check(response.status === 401, method + ' invalid token returned ' + response.status);
            console.log('PASS AUTH GUARD: ' + method + ' invalid token -> 401.');
          }
          NODE

      - name: Live Firebase Round-Trip, Cross-Tenant Isolation and 409 Conflict
        env:
          STAGING_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          PROD_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          WORKER_BASE_URL: https://anas-erp-firebase-snapshot-staging.amin545677.workers.dev
          EXPECTED_ORIGIN: https://amin545677-svg.github.io
          EXPECTED_PROJECT_ID: anas-erp-staging-a25e1
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const rawKey = process.env.STAGING_FIREBASE_API_KEY || "";
          const cleanKey = rawKey.replace(/["'\s\r\n]/g, "");
          const productionSecret = (process.env.PROD_FIREBASE_API_KEY || "").replace(/["'\s\r\n]/g, "");
          const html = readFileSync("index.html", "utf8");
          const productionConfigKey = html.match(/apiKey\s*:\s*["']([^"']+)["']/)?.[1] || "";
          const projectId = process.env.EXPECTED_PROJECT_ID;
          const base = process.env.WORKER_BASE_URL;
          const origin = process.env.EXPECTED_ORIGIN;
          console.log(`Key Diagnostic -> Raw Length: ${rawKey.length}, Clean Length: ${cleanKey.length}, StartsWith AIza: ${cleanKey.startsWith("AIza")}`);
          if (!/^AIza[0-9A-Za-z_-]+$/.test(cleanKey)) {
            throw new Error("Staging Firebase API key has an invalid Web API key shape; value withheld.");
          }
          if ((productionSecret && cleanKey === productionSecret) ||
              (productionConfigKey && cleanKey === productionConfigKey)) {
            throw new Error("Staging key matches a known Production Firebase key; aborting before creating any Firebase identity.");
          }

          const authEndpoint = "https://identitytoolkit.googleapis.com/v1";
          const firestoreBase = "https://firestore.googleapis.com/v1/projects/" +
            encodeURIComponent(projectId) + "/databases/(default)/documents";
          const createdUsers = [];
          let snapshotDocumentCreated = false;
          const check = (condition, message) => { if (!condition) throw new Error(message); };
          const parse = async (response) => response.json().catch(() => ({}));

          async function createTemporaryUser() {
            const response = await fetch(authEndpoint + "/accounts:signUp?key=" + encodeURIComponent(cleanKey), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ returnSecureToken: true }),
            });
            const body = await parse(response);
            if (!response.ok) {
              const reason = body?.error?.message || String(response.status);
              if (reason === "OPERATION_NOT_ALLOWED") {
                throw new Error("Firebase API key was accepted, but Anonymous Authentication is disabled in the Staging project.");
              }
              throw new Error("Firebase temporary identity creation failed: " + reason);
            }
            check(body.idToken && body.localId, "Firebase Auth returned no temporary ID token or UID.");
            const claims = JSON.parse(Buffer.from(body.idToken.split(".")[1], "base64url").toString("utf8"));
            return { uid: body.localId, idToken: body.idToken, aud: claims.aud };
          }

          async function deleteTemporaryUser(user) {
            const response = await fetch(authEndpoint + "/accounts:delete?key=" + encodeURIComponent(cleanKey), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ idToken: user.idToken }),
            });
            const body = await parse(response);
            if (!response.ok && body?.error?.message !== "USER_NOT_FOUND") {
              throw new Error("Temporary Firebase identity cleanup failed: " + (body?.error?.message || response.status));
            }
          }

          const workerCall = async (path, method, token, body) => fetch(base + path, {
            method,
            headers: {
              Origin: origin,
              Authorization: "Bearer " + token,
              ...(body ? { "Content-Type": "application/json" } : {}),
            },
            ...(body ? { body: JSON.stringify(body) } : {}),
            cache: "no-store",
          });

          try {
            const userA = await createTemporaryUser();
            createdUsers.push(userA);
            check(userA.aud === projectId, "Firebase key resolved to project " + String(userA.aud) + ", not Staging; temporary identity will be deleted.");
            const userB = await createTemporaryUser();
            createdUsers.push(userB);
            check(userB.aud === projectId, "Second Firebase identity did not resolve to Staging; temporary identity will be deleted.");
            console.log("PASS FIREBASE AUTH: two temporary Staging identities created; project audience verified.");

            const metadataResponse = await workerCall("/snapshot?metadata=1", "GET", userA.idToken);
            const metadata = await parse(metadataResponse);
            check(metadataResponse.status === 200, "Staging Worker metadata GET failed: HTTP " + metadataResponse.status);
            const initialRevision = metadata.revision ?? null;

            const testId = "staging-roundtrip-" + process.env.GITHUB_SHA.slice(0, 12);
            const firstData = {
              products: [{ id: testId, name: "Temporary Staging Parity Test", stock: 500.50 }],
              customers: [{ id: testId, name: "Temporary Staging Customer", debt: 0 }],
            };
            const firstSaveResponse = await workerCall("/snapshot", "POST", userA.idToken, {
              data: JSON.stringify(firstData),
              revision: initialRevision,
            });
            const firstSave = await parse(firstSaveResponse);
            check(firstSaveResponse.status === 200 && firstSave.saved === true && firstSave.revision,
              "Staging round-trip upload failed: HTTP " + firstSaveResponse.status + " " + (firstSave.error || ""));
            snapshotDocumentCreated = true;

            const readResponse = await workerCall("/snapshot", "GET", userA.idToken);
            const readBack = await parse(readResponse);
            check(readResponse.status === 200 && readBack.exists === true, "Staging round-trip read failed.");
            const roundTripData = JSON.parse(readBack.data);
            check(roundTripData.products?.[0]?.stock === 500.5, "Decimal parity failed: 500.50 did not round-trip as numeric 500.5.");
            console.log("PASS ROUND-TRIP: 500.50 persisted and read back exactly as numeric 500.5.");

            const secondData = {
              products: [{ id: testId, name: "Temporary Staging Parity Test", stock: 501.25 }],
              customers: [{ id: testId, name: "Temporary Staging Customer", debt: 0 }],
            };
            const secondSaveResponse = await workerCall("/snapshot", "POST", userA.idToken, {
              data: JSON.stringify(secondData),
              revision: firstSave.revision,
            });
            const secondSave = await parse(secondSaveResponse);
            check(secondSaveResponse.status === 200 && secondSave.revision, "Second revision update failed.");

            const staleResponse = await workerCall("/snapshot", "POST", userA.idToken, {
              data: JSON.stringify(firstData),
              revision: firstSave.revision,
            });
            const staleBody = await parse(staleResponse);
            check(staleResponse.status === 409 && staleBody.conflict === true,
              "Stale revision did not return 409 Conflict; received HTTP " + staleResponse.status);
            console.log("PASS REVISION GUARD: stale snapshot write -> HTTP 409 Conflict.");

            const foreignDocUrl = firestoreBase + "/users/" + encodeURIComponent(userB.uid) + "/snapshots/latest";
            const crossTenantResponse = await fetch(foreignDocUrl, {
              headers: { Authorization: "Bearer " + userA.idToken },
              cache: "no-store",
            });
            const crossTenantBody = await parse(crossTenantResponse);
            check(crossTenantResponse.status === 403 &&
              crossTenantBody?.error?.status === "PERMISSION_DENIED",
              "Cross-tenant Firestore read was not denied with HTTP 403.");
            console.log("PASS CROSS-TENANT ISOLATION: User A reading User B snapshot -> HTTP 403.");

          } finally {
            const cleanupErrors = [];
            if (snapshotDocumentCreated && createdUsers[0]) {
              try {
                const docUrl = firestoreBase + "/users/" + encodeURIComponent(createdUsers[0].uid) + "/snapshots/latest";
                const response = await fetch(docUrl, {
                  method: "DELETE",
                  headers: { Authorization: "Bearer " + createdUsers[0].idToken },
                });
                if (!response.ok && response.status !== 404) {
                  throw new Error("Temporary snapshot cleanup failed: HTTP " + response.status);
                }
                console.log("PASS CLEANUP: temporary Staging snapshot document deleted.");
              } catch (error) {
                cleanupErrors.push(error.message);
              }
            }
            for (const user of createdUsers.reverse()) {
              try { await deleteTemporaryUser(user); }
              catch (error) { cleanupErrors.push(error.message); }
            }
            if (cleanupErrors.length) throw new Error(cleanupErrors.join("; "));
            if (createdUsers.length) console.log("PASS CLEANUP: all temporary Firebase identities deleted.");
          }
          NODE
