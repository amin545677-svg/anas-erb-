name: Deploy ANAS ERP Firebase Worker

on:
  # Deploy only after an explicit manual action.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Firebase snapshot Worker before deployment
        run: node --test tests/worker_firebase_snapshot.test.mjs

      # Firebase web API keys are public client configuration, already present
      # in index.html. Prefer an explicit repository secret if supplied, but
      # safely derive the same key from the app config when it is absent.
      - name: Resolve Firebase API key
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            FIREBASE_API_KEY="$(python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'apiKey\s*:\s*["\']([^"\']+)["\']', html)
          if not match:
              raise SystemExit("Could not find Firebase apiKey in index.html; add FIREBASE_API_KEY as a repository secret.")
          print(match.group(1))
          PY
          )"
          fi
          test -n "$FIREBASE_API_KEY" || (echo "::error::Firebase API key is unavailable." && exit 1)
          echo "::add-mask::$FIREBASE_API_KEY"
          printf 'FIREBASE_API_KEY=%s\n' "$FIREBASE_API_KEY" >> "$GITHUB_ENV"

      - name: Check required Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Add repository secret CLOUDFLARE_API_TOKEN first." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Add repository secret CLOUDFLARE_ACCOUNT_ID first." && exit 1)

      - name: Deploy Firebase snapshot Worker
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: cloudflare
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            FIREBASE_API_KEY
