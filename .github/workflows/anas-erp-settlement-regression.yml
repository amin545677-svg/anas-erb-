name: ANAS ERP Settlement Regression
on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/anas-erp-settlement-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settlement-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate truck settlement invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          start = source.find("window.anasTruckSettle = function(id){")
          end = source.find("window.anasTruckDelete = function(id){", start)
          assert start >= 0 and end > start, "Could not isolate truck settlement handler"
          settle = source[start:end]
          checks = {
              "settlement only allowed after delivery": "trip.status!=='delivered'" in settle,
              "settlement requires a posted non-empty load": "!trip.stockPostedAt||!Array.isArray(trip.stockItems)||!trip.stockItems.length" in settle,
              "repeat settlement is rejected": "trip.settlementId||trip.settledAt" in settle,
              "delivered, returned, damaged and missing quantities reconcile to loaded quantity": "Math.abs(delivered+returned+damaged+missing-loaded)>1e-8" in settle,
              "invoices must be linked for delivered quantities": "if(!ids.length)" in settle and "لا يمكن اعتماد كمية مسلّمة دون فواتير" in settle,
              "invoice must exist": "if(!inv)" in settle,
              "invoice must belong to this truck warehouse": "!==warehouse" in settle,
              "invoice cannot be reused by another trip settlement": "settlementInvoiceIds" in settle and "مرتبطة بتسوية رحلة أخرى" in settle,
              "invoice lines require valid positive quantities": "Number.isFinite(qty)||qty<=0" in settle,
              "invoiced quantities must match delivered quantities": "invoiced.get(productId)||0)-qty" in settle,
              "settlement records linked invoice IDs": "trip.settlementInvoiceIds=linked.map(inv=>String(inv.id))" in settle,
              "settlement writes explicit stock movement references": "referenceType:'truck_settlement'" in settle,
              "settlement rollback restores product stock and warehouse balances": "old.p.stock=old.stock" in settle and "old.p.warehouseStock=old.warehouseStock||{}" in settle,
              "settlement rollback restores movement ledger": "movesBefore===null" in settle and "AppData.stockMovements=movesBefore" in settle,
              "settlement rollback restores settlement metadata": "tripBefore[key]===undefined" in settle and "trip[key]=tripBefore[key]" in settle,
              "settlement save failure triggers rollback": "if(saveDB()===false)throw new Error('فشل حفظ التسوية.')" in settle,
              "settlement does not create a second revenue or debt entry": "لم تُنشأ إيرادات أو ديون جديدة" in settle,
          }
          failed = []
          for name, passed in checks.items():
              print(("PASS" if passed else "FAIL") + ": " + name)
              if not passed:
                  failed.append(name)
          if failed:
              raise SystemExit("Truck settlement regression checks failed: " + "; ".join(failed))
          print(f"All {len(checks)} truck settlement regression checks passed.")
          PY
