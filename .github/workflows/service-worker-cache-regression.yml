name: ANAS ERP Service Worker Cache Regression

on:
  push:
    branches: [main]
    paths:
      - "sw.js"
      - "index.html"
      - "reverse-ledger/**"
      - "tests/test_service_worker_cache.py"
      - "tests/service_worker_runtime_test.js"
      - ".github/workflows/service-worker-cache-regression.yml"
  pull_request:
    paths:
      - "sw.js"
      - "tests/test_service_worker_cache.py"
      - "tests/service_worker_runtime_test.js"
      - ".github/workflows/service-worker-cache-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-worker-cache-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify service-worker update and offline-cache invariants
        run: python tests/test_service_worker_cache.py
      - name: Exercise service-worker cache behavior with runtime mocks
        run: node tests/service_worker_runtime_test.js
