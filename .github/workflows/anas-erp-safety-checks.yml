name: ANAS ERP Safety Checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tests/**"
      - "cloudflare/**"
      - "firebase/**"
      - ".github/workflows/anas-erp-safety-checks.yml"
      - ".github/workflows/deploy-firebase-worker.yml"
  pull_request:
    paths:
      - "index.html"
      - "tests/**"
      - "cloudflare/**"
      - "firebase/**"
      - ".github/workflows/anas-erp-safety-checks.yml"
      - ".github/workflows/deploy-firebase-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate full app remains intact
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          assert len(s.encode("utf-8")) > 400_000, f"Unexpectedly small app entry point: {p.stat().st_size} bytes"
          assert "ANAS_THE_ENTERPRISE_V11_OFFLINE" in s, "Existing local data key is missing"
          assert "anasFirebaseGoogleLogin" in s, "Firebase Google login hook is missing"
          assert "anasWorkerUrl" in s, "Worker configuration field is missing"
          assert "</html>" in s.lower(), "HTML document appears incomplete"
          print(f"Full app entry point present: {p.stat().st_size} bytes")
          PY
      - name: Exercise sales invoice print HTML escaping
        run: node tests/invoice_print_html_escape_test.js
      - name: Guard invoice bulk-delete safety handlers
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          app = Path("index.html").read_text(encoding="utf-8")
          def function_bodies(name):
              # Keep the existing simple-body checks for small safety handlers.
              pattern = re.compile(r"function\s+" + re.escape(name) + r"\s*\([^)]*\)\s*\{")
              bodies = []
              for match in pattern.finditer(app):
                  start = match.end()
                  end = app.find("}", start)
                  assert end >= 0, f"Unclosed function: {name}"
                  bodies.append(app[start:end])
              return bodies
          def function_source(name):
              pattern = re.compile(r"function\s+" + re.escape(name) + r"\s*\([^)]*\)\s*\{")
              match = pattern.search(app)
              if not match:
                  return ""
              end = app.find("\n        function ", match.end())
              return app[match.start():end if end >= 0 else len(app)]
          checks = {
              "exactly one active purchase-invoice clear handler": len(function_bodies("clearAllPurchaseInvoices")) == 1,
              "exactly one active invoice reset handler": len(function_bodies("autoResetAllInvoicesNow")) == 1,
              "purchase-invoice handler keeps safety guard": any("تنبيه أمني" in body and "معطلة" in body for body in function_bodies("clearAllPurchaseInvoices")),
              "invoice reset handler keeps safety guard": any("تنبيه أمني" in body and "إلغاء المسح الشامل" in body for body in function_bodies("autoResetAllInvoicesNow")),
              "legacy destructive purchase handler is not active under the UI name": len(function_bodies("old_clearAllPurchaseInvoices")) == 1,
              "legacy destructive reset handler is not active under the UI name": len(function_bodies("old_autoResetAllInvoicesNow")) == 1,
              "invoice cancellation is guarded": len(function_bodies("cancelInvoicePrompt")) == 1 and "لم تتغير أي بيانات" in function_bodies("cancelInvoicePrompt")[0],
              "legacy destructive cancellation is renamed": len(function_bodies("old_cancelInvoicePrompt")) == 1,
              "sales return does not falsely claim posting": len(function_bodies("returnSalePrompt")) == 1 and "لم يتم تعديل" in function_bodies("returnSalePrompt")[0],
              "purchase return does not falsely claim posting": len(function_bodies("returnPurchasePrompt")) == 1 and "لم يتم تعديل" in function_bodies("returnPurchasePrompt")[0],
              "legacy sales return prompt is renamed": len(function_bodies("old_returnSalePrompt")) == 1,
              "legacy purchase return prompt is renamed": len(function_bodies("old_returnPurchasePrompt")) == 1,
              "only one active quick-product renderer": len(function_bodies("renderQuickProducts")) == 1,
              "active quick-product renderer keeps category filtering": len(function_bodies("renderQuickProducts")) == 1 and "currentPosCategoryFilter" in function_bodies("renderQuickProducts")[0],
              "legacy simple product renderer renamed": len(function_bodies("old_renderQuickProducts")) == 1,
              "only one active quick-sale opener": len(function_bodies("openQuickSale")) == 1,
              "active quick-sale opener uses quick-sale panel": len(function_bodies("openQuickSale")) == 1 and "quickSalePanel" in function_bodies("openQuickSale")[0],
              "legacy quick-sale opener renamed": len(function_bodies("old_openQuickSale")) == 1,
              "product deletion rejects nonzero stock": len(function_bodies("deleteProduct")) == 1 and "mainStock !== 0 || warehouseStock !== 0" in function_source("deleteProduct"),
              "product deletion checks historical references": len(function_bodies("deleteProduct")) == 1 and "stockMovements" in function_source("deleteProduct") and "invoices" in function_source("deleteProduct"),
              "product deletion requires exact name confirmation": len(function_bodies("deleteProduct")) == 1 and "typedName" in function_source("deleteProduct") and "1234" not in function_source("deleteProduct"),
              "product deletion rolls back on explicit save failure": len(function_bodies("deleteProduct")) == 1 and "saved !== true" in function_source("deleteProduct"),
              "truck deletion fails closed on missing/implicit persistence": "typeof saveDB!=='function'||saveDB()!==true" in app[app.find("window.anasTruckDelete = function(id){"):app.find("window.anasTruckRender = function(){")],
              "stocktake draft save checks explicit persistence failure": "saveDB()!==true" in app[app.find("window.anasSaveStocktakeDraft=function()"):app.find("window.anasExportStocktake=function()")],
              "stocktake draft save restores previous drafts on failure": "setDrafts(previousDrafts)" in app[app.find("window.anasSaveStocktakeDraft=function()"):app.find("window.anasExportStocktake=function()")],
              "stocktake draft save returns explicit status": "return false" in app[app.find("window.anasSaveStocktakeDraft=function()"):app.find("window.anasExportStocktake=function()")] and "return true" in app[app.find("window.anasSaveStocktakeDraft=function()"):app.find("window.anasExportStocktake=function()")],
              "warehouse transfer initializes missing per-product warehouse map": "if(!p.warehouseStock||typeof p.warehouseStock!=='object'||Array.isArray(p.warehouseStock))p.warehouseStock={};" in app[app.find("function wtCreateTransfer()"):app.find("function wtRenderHistory()")],
              "warehouse transfer snapshots warehouse map before mutation": app.find("const beforeWarehouseStock=",app.find("function wtCreateTransfer()")) < app.find("if(!p.warehouseStock||typeof p.warehouseStock!=='object'||Array.isArray(p.warehouseStock))p.warehouseStock={};",app.find("function wtCreateTransfer()")),
              "warehouse transfer restores absent warehouse map on rollback": "else delete p.warehouseStock;" in app[app.find("function wtCreateTransfer()"):app.find("function wtRenderHistory()")],
              "bulk price update validates complete numeric input": "const pct=Number(raw);" in app[app.find("function bulkEditPricesPrompt()"):app.find("// ================= بطاقة المنتج والوحدة والصور") ] and "pct < -100" in app[app.find("function bulkEditPricesPrompt()"):app.find("// ================= بطاقة المنتج والوحدة والصور")],
              "bulk price update validates all prices before mutation": app.find("for(const p of AppData.products)",app.find("function bulkEditPricesPrompt()")) < app.find("changes.forEach(c=>{c.p[c.key]=c.newPrice;}",app.find("function bulkEditPricesPrompt()")),
              "bulk price update rolls back on save failure": "before.forEach(c=>{c.p[c.key]=c.value;});" in app[app.find("function bulkEditPricesPrompt()"):app.find("// ================= بطاقة المنتج والوحدة والصور")],
              "category creation checks persistence and duplicate names": "AppData.productCategories" in app[app.find("function addNewProductCategory()"):app.find("function bulkEditPricesPrompt()")] and "saveDB()!==true" in app[app.find("function addNewProductCategory()"):app.find("function bulkEditPricesPrompt()")],
              "category suggestions are connected to product form": 'list="productCategoriesDatalist"' in app and 'id="productCategoriesDatalist"' in app and "populateProductCategorySuggestions();" in app[app.find("function openAddProductModal()"):app.find("function addNewCustomUnit()")],
              "category suggestions include saved and existing product categories": "AppData.productCategories" in app[app.find("function populateProductCategorySuggestions()"):app.find("function addNewProductCategory()")] and "p.cat||p.category||p.categoryName" in app[app.find("function populateProductCategorySuggestions()"):app.find("function addNewProductCategory()")],
              "category creation selects new category for current product": "input.value=name" in app[app.find("function addNewProductCategory()"):app.find("function bulkEditPricesPrompt()")],
              "custom units are persisted and loaded into product form": "AppData.productUnits" in app[app.find("function populateProductUnitOptions()"):app.find("function addNewCustomUnit()")] and "populateProductUnitOptions();" in app[app.find("function openAddProductModal()"):app.find("function addNewCustomUnit()")],
              "custom unit save checks persistence and rolls back on failure": "saveDB()!==true" in app[app.find("function addNewCustomUnit()"):app.find("function previewAndCompressProductImage")] and "AppData.productUnits=previous" in app[app.find("function addNewCustomUnit()"):app.find("function previewAndCompressProductImage")],
              "custom unit creation avoids duplicate values": "هذه الوحدة موجودة بالفعل" in app[app.find("function addNewCustomUnit()"):app.find("function previewAndCompressProductImage")],
              "truck load validates each item quantity before aggregation": "const qty=Number(item.qty)" in app[app.find("function postTripStock(trip)"):app.find("window.anasTruckSaveTrip")] and "كل كمية في حمولة الشاحنة" in app[app.find("function postTripStock(trip)"):app.find("window.anasTruckSaveTrip")],
              "truck load blocks reposting when prior movements exist": "priorTripMoves.length" in app[app.find("function postTripStock(trip)"):app.find("window.anasTruckSaveTrip")] and "لمنع تكرار خصم أو إضافة المخزون" in app[app.find("function postTripStock(trip)"):app.find("window.anasTruckSaveTrip")],
              "truck load rollback restores prior trip metadata": "oldPostedAt" in app[app.find("function postTripStock(trip)"):app.find("window.anasTruckSaveTrip")] and "oldWarehouseName" in app[app.find("function postTripStock(trip)"):app.find("window.anasTruckSaveTrip")],
              "product save validates all numeric fields before mutation": app.find("numberField('newProdBuyCostInput'",app.find("function saveNewProductFromModal()")) < app.find("if(index>=0){",app.find("function saveNewProductFromModal()")),
              "product save rejects negative and invalid numeric values": "n<0" in app[app.find("function saveNewProductFromModal()"):app.find("// ================= تقارير الأرباح الشاملة")] and "Number.isFinite(Number(raw))" in app[app.find("function saveNewProductFromModal()"):app.find("// ================= تقارير الأرباح الشاملة")],
              "product save prevents duplicate barcodes": "duplicateBarcode" in app[app.find("function saveNewProductFromModal()"):app.find("// ================= تقارير الأرباح الشاملة")],
              "product save rejects stale edit identifiers": "if(editId&&index<0)" in app[app.find("function saveNewProductFromModal()"):app.find("// ================= تقارير الأرباح الشاملة")],
              "product save uses collision-resistant new IDs": "P-'+Date.now().toString(36)" in app[app.find("function saveNewProductFromModal()"):app.find("// ================= تقارير الأرباح الشاملة")],
              "product save restores prior products when persistence fails": "saveDB()!==true" in app[app.find("function saveNewProductFromModal()"):app.find("// ================= تقارير الأرباح الشاملة")] and "AppData.products=beforeProducts" in app[app.find("function saveNewProductFromModal()"):app.find("// ================= تقارير الأرباح الشاملة")],
          }
          for name, passed in checks.items():
              print(("PASS" if passed else "FAIL") + ": " + name)
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Invoice deletion safety checks failed: " + "; ".join(failed))
          print(f"All {len(checks)} invoice deletion safety checks passed.")
          PY
      - name: Test strict Z-report cash balance normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          start = s.find("        function anasFormatZReportCashBalance(value) {")
          end = s.find("\n        function printZReport()", start)
          assert start >= 0 and end > start, "Could not isolate Z-report cash formatter"
          function_js = s[start:end]
          js = r"""
          const assert = require('node:assert/strict');
          /*INSERT_FORMATTER*/
          for (const value of [null, undefined, '', '   ', false, true, {}, [], 'abc', Infinity, -Infinity, NaN]) {
            assert.equal(anasFormatZReportCashBalance(value), 'غير صالح', 'invalid cash balance must not appear as zero: ' + String(value));
          }
          assert.equal(anasFormatZReportCashBalance(0), '0');
          assert.equal(anasFormatZReportCashBalance(1250), (1250).toLocaleString());
          assert.equal(anasFormatZReportCashBalance('1250'), (1250).toLocaleString());
          assert.equal(anasGetZReportTotal([{total: 10}, {total: '20'}], 'total'), 30);
          assert.equal(anasGetZReportTotal([], 'total'), 0);
          assert.equal(anasGetZReportTotal([{total: 0}, {total: '0'}], 'total'), 0);
          for (const invoices of [null, {}, [{total: null}], [{total: ''}], [{total: '   '}], [{total: false}], [{total: true}], [{total: 'abc'}], [{total: Infinity}], [{total: {}}], [[{total: 1}]], [{}, {total: 2}], [{total: Number.MAX_VALUE}, {total: Number.MAX_VALUE}]]) {
            assert.equal(anasGetZReportTotal(invoices, 'total'), null, 'malformed invoice totals must not be coerced to zero');
          }
          assert.equal(anasGetZReportTotal([{paid: 5}, {paid: '7'}], 'paid'), 12);
          assert.equal(anasGetZReportTotal([{remaining: 4}, {remaining: '6'}], 'remaining'), 10);
          assert.equal(anasFormatZReportTotal(30), (30).toLocaleString());
          assert.equal(anasFormatZReportTotal(null), 'غير صالح');
          assert.equal(anasFormatZReportTotal(NaN), 'غير صالح');
          console.log('Z-report tests passed: cash and invoice aggregates reject malformed values without zero-coercion');
          """
          js = js.replace("/*INSERT_FORMATTER*/", function_js)
          Path("/tmp/anas-z-report-cash-test.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/anas-z-report-cash-test.js
          node /tmp/anas-z-report-cash-test.js

      - name: Check Worker JavaScript syntax
        run: node --check cloudflare/worker_firebase_snapshot.js
      - name: Check OpenAI AI Worker JavaScript syntax
        run: node --check cloudflare/worker_openai_ai.js
      - name: Validate Worker contract and security guards
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("cloudflare/worker_firebase_snapshot.js").read_text(encoding="utf-8")
          required = [
              "verifyFirebaseToken", "Access-Control-Allow-Origin",
              "request.method === \"GET\"", "request.method === \"POST\"",
              "Array.isArray(appData.products)", "Array.isArray(appData.customers)",
              "MAX_BODY_BYTES", "FIREBASE_PROJECT_ID", "ALLOWED_ORIGINS"
          ]
          missing = [x for x in required if x not in s]
          assert not missing, f"Missing Worker safety/contract markers: {missing}"
          print("Worker syntax and required contract markers passed")
          PY
      - name: Validate OpenAI AI gateway health and UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("cloudflare/worker_openai_ai.js").read_text(encoding="utf-8")
          app = Path("index.html").read_text(encoding="utf-8")
          deploy = Path(".github/workflows/deploy-openai-ai-worker.yml").read_text(encoding="utf-8")
          checks = {
              "health endpoint reports the expected service": 'service: "anas-erp-openai-ai"' in worker,
              "health endpoint reports API-key configuration without exposing the key": "configured: Boolean(env.OPENAI_API_KEY)" in worker,
              "health endpoint returns model metadata": "model: env.OPENAI_MODEL || DEFAULT_MODEL" in worker,
              "request body has a size limit": "MAX_BODY_BYTES" in worker,
              "OpenAI calls disable response storage": "store: false" in worker,
              "UI calls the health endpoint": "fetch(url+'/health'" in app,
              "UI verifies the worker service identity": "anas-erp-openai-ai" in app,
              "UI submits chat messages": "type:\'chat\'" in app and "businessData:anasBuildBusinessSnapshot()" in app,
              "UI reads the text response": "data.text" in app,
              "manual deployment requires Cloudflare token": "secrets.CLOUDFLARE_API_TOKEN" in deploy,
              "manual deployment requires Cloudflare account id": "secrets.CLOUDFLARE_ACCOUNT_ID" in deploy,
              "manual deployment requires OpenAI key": "secrets.OPENAI_API_KEY" in deploy,
              "worker deployment remains manual-only": "workflow_dispatch:" in deploy and "push:" not in deploy,
          }
          missing = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(("PASS" if passed else "FAIL") + ": " + name)
          if missing:
              raise SystemExit("AI gateway contract checks failed: " + "; ".join(missing))
          print(f"All {len(checks)} AI gateway contract checks passed.")
          PY
      - name: Exercise OpenAI AI Worker health, CORS, and input guards
        run: |
          cp cloudflare/worker_openai_ai.js /tmp/anas-openai-worker.mjs
          cat > /tmp/anas-openai-worker-smoke.mjs <<'JS'
          import assert from 'node:assert/strict';
          import worker from './anas-openai-worker.mjs';

          const call = (url, init = {}, env = {}) => worker.fetch(
            new Request(url, init), env
          );
          const allowed = { ALLOWED_ORIGINS: 'https://amin545677-svg.github.io' };
          let response = await call('https://worker.example/health');
          assert.equal(response.status, 200, 'direct health endpoint should respond');
          let body = await response.json();
          assert.equal(body.ok, true);
          assert.equal(body.service, 'anas-erp-openai-ai');
          assert.equal(body.configured, false, 'health check must not require or expose a key');
          assert.equal(body.model, 'gpt-4.1-mini');

          response = await call('https://worker.example/health', {
            headers: { Origin: 'https://amin545677-svg.github.io' }
          }, allowed);
          assert.equal(response.status, 200);
          assert.equal(response.headers.get('Access-Control-Allow-Origin'), 'https://amin545677-svg.github.io');

          response = await call('https://worker.example/health', {
            headers: { Origin: 'https://evil.example' }
          }, allowed);
          assert.equal(response.status, 403, 'unapproved origin must be rejected');

          response = await call('https://worker.example/', {
            method: 'POST',
            headers: { Origin: 'https://amin545677-svg.github.io', 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'test' })
          }, allowed);
          assert.equal(response.status, 503, 'chat without API key must fail safely before upstream call');

          response = await call('https://worker.example/not-found', {
            headers: { Origin: 'https://amin545677-svg.github.io' }
          }, allowed);
          assert.equal(response.status, 404);

          console.log('OpenAI Worker runtime smoke tests passed: health, key-free check, CORS allow/deny, missing-key guard, and 404.');
          JS
          node /tmp/anas-openai-worker-smoke.mjs
      - name: Exercise OpenAI AI Worker malformed and oversized request guards
        run: |
          cp cloudflare/worker_openai_ai.js /tmp/anas-openai-worker-errors.mjs
          cat > /tmp/anas-openai-worker-errors-test.mjs <<'JS'
          import assert from 'node:assert/strict';
          import worker from './anas-openai-worker-errors.mjs';

          const origin = 'https://amin545677-svg.github.io';
          const env = {
            ALLOWED_ORIGINS: origin,
            OPENAI_API_KEY: 'test-key-not-used'
          };
          let upstreamCalls = 0;
          globalThis.fetch = async () => {
            upstreamCalls++;
            throw new Error('Upstream fetch must not run for invalid requests');
          };
          const call = (body, extra = {}) => worker.fetch(new Request('https://worker.example/', {
            method: 'POST',
            headers: { Origin: origin, 'Content-Type': 'application/json', ...extra.headers },
            body,
            ...Object.fromEntries(Object.entries(extra).filter(([key]) => key !== 'headers'))
          }), env);

          let response = await call('{broken-json');
          assert.equal(response.status, 400, 'malformed JSON should return 400');

          response = await call(JSON.stringify({ message: '   ' }));
          assert.equal(response.status, 400, 'blank question should return 400');

          response = await call(JSON.stringify({ message: 'x'.repeat(130 * 1024) }));
          assert.equal(response.status, 413, 'oversized request body should return 413');

          response = await call(JSON.stringify({ message: 'summarize', businessData: 'x'.repeat(31 * 1024) }));
          assert.equal(response.status, 413, 'oversized business summary should return 413');

          response = await worker.fetch(new Request('https://worker.example/', {
            method: 'GET', headers: { Origin: origin }
          }), env);
          assert.equal(response.status, 404, 'unsupported method/path should return 404');

          assert.equal(upstreamCalls, 0, 'invalid requests must not reach the OpenAI API');
          console.log('OpenAI Worker error-path tests passed: malformed JSON, blank question, body limit, business-data limit, unsupported method, and no upstream calls.');
          JS
          node /tmp/anas-openai-worker-errors-test.mjs
      - name: Check contextual AI helper JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          marker = "<!-- ANAS ERP: contextual AI helper available throughout the app; additive only -->"
          start = s.find(marker)
          assert start >= 0, "Contextual AI helper marker not found"
          script_start = s.find("<script>", start)
          script_end = s.find("</script>", script_start)
          assert script_start >= 0 and script_end > script_start, "Contextual AI helper script block is incomplete"
          js = s[script_start + len("<script>"):script_end]
          Path("/tmp/anas-context-ai-helper.js").write_text(js, encoding="utf-8")
          print("Extracted contextual AI helper script for syntax validation")
          PY
          node --check /tmp/anas-context-ai-helper.js
      - name: Validate contextual AI helper privacy guards
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="anasContextAiFab"', 'id="anasContextAiPanel"',
              "anasErpAiGatewayUrlV1", "function safeContext(el)",
              "type==='password'||type==='file'",
              "let savedUrl='';", "try{savedUrl=localStorage.getItem",
              "if(include.checked&&typeof window.anasBuildBusinessSnapshot==='function')",
              "لم تُرسل قيمة الخانة."
          ]
          missing = [x for x in required if x not in s]
          assert not missing, f"Missing contextual AI helper/privacy markers: {missing}"
          print("Contextual AI helper presence and privacy guards passed")
          PY
      - name: Exercise localized spreadsheet number parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          start = s.find("function anasParseImportNumber(value,field,rowNo)")
          end = s.find("function showSmartImportPreview(fileName,rows)", start)
          assert start >= 0 and end > start, "Could not isolate localized number parser"
          js = s[start:end] + r"""
          const assert = require('node:assert/strict');
          const parse = v => anasParseImportNumber(v, 'price', 2);
          assert.equal(parse('1234.56'), 1234.56);
          assert.equal(parse('1234,56'), 1234.56, 'decimal comma should be supported');
          assert.equal(parse('1,234.56'), 1234.56, 'US grouping and decimal separators should parse');
          assert.equal(parse('1.234,56'), 1234.56, 'European grouping and decimal separators should parse');
          assert.equal(parse('1,234,567'), 1234567, 'repeated three-digit grouping separators should parse');
          assert.equal(parse('١٬٢٣٤٫٥٦'), 1234.56, 'Arabic-Indic digits and Arabic separators should parse');
          assert.equal(parse(''), 0, 'empty optional numeric cells should default to zero');
          assert.throws(() => parse('1,234'), /ملتبسة/, 'ambiguous one-separator values must not silently change magnitude');
          assert.throws(() => parse('1,23.456'), /تجميع الآلاف غير صحيح/, 'malformed grouping must be rejected instead of silently changing magnitude');
          assert.throws(() => parse('12abc'), /غير صحيحة/, 'invalid numeric content must be rejected');
          console.log('Localized numeric import tests passed');
          """
          Path("/tmp/anas-number-parser-test.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/anas-number-parser-test.js
          node /tmp/anas-number-parser-test.js
      - name: Exercise purchase product ID and barcode collision guards
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          start = s.find("function anasCreateUniqueProductId(products)")
          end = s.find("function savePurchaseItem()", start)
          assert start >= 0 and end > start, "Could not locate purchase ID/barcode generators"
          helpers = s[start:end]
          norm_start = s.find("function anasNormalizeBarcode(value)")
          norm_end = s.find("function saveNewProductFromModal()", norm_start)
          assert norm_start >= 0 and norm_end > norm_start, "Could not locate barcode normalizer"
          normalizer = s[norm_start:norm_end]
