            if (withLegacyFields) Object.assign(invoice,{total:20,paid:0,remaining:20,paymentMethod:'credit',editedAt:'before-edit'});
            const product = secondaryMissingMain ? {id:'p1',name:'Product',warehouseStock:{W1:5}} : {id:'p1',name:'Product',stock:5,warehouseStock:{}};
            const movements = [{id:'prior-movement'}];
            const data = {invoices:[invoice],products:[product],customers:[customer],stockMovements:movements};
            const answers = ['3','10'];
            const alerts = [];
            const ctx = {
              AppData:data,
              prompt:()=>answers.shift(),
              confirm:()=>true,
              alert:(m)=>alerts.push(String(m)),
              saveDB:()=>false,
              renderInvoicesList:()=>{},
              renderInventoryList:()=>{},
              wtAvailableStock:(p,warehouse)=>warehouse==='المخزن الرئيسي'?p.stock:(p.warehouseStock?.[warehouse]??0),
              console, Number, String, Object, Array, Map, Math, Date
            };
            vm.runInNewContext(functionSource + '\neditSalesInvoice("I1");', ctx);
            if (secondaryMissingMain) {
              assert.equal(Object.hasOwn(product,'stock'),false,'rollback must not create an absent primary stock field');
              assert.equal(product.warehouseStock.W1,5,'secondary warehouse balance must roll back');
            } else {
              assert.equal(product.stock,5,'stock balance must roll back after failed persistence');
            }
            assert.deepEqual(data.stockMovements,[{id:'prior-movement'}],'ledger must roll back after failed persistence');
            assert.equal(invoice.items[0].qty,2,'invoice lines must roll back');
            if (withLegacyFields) {
              assert.equal(invoice.total,20);
              assert.equal(invoice.paid,0);
              assert.equal(invoice.remaining,20);
              assert.equal(invoice.paymentMethod,'credit');
              assert.equal(invoice.editedAt,'before-edit','existing audit metadata must be restored');
              assert.equal(customer.debt,20);
            } else {
              for (const key of ['total','paid','remaining','paymentMethod','editedAt']) {
                assert.equal(Object.hasOwn(invoice,key),false,'rollback must not create absent legacy invoice field '+key);
              }
              assert.equal(Object.hasOwn(customer,'debt'),false,'rollback must not create an absent legacy debt field');
