            assert.equal(invoice.items[0].qty,1e308,'overflow guard must preserve original invoice');
            assert.equal(ctx.AppData.stockMovements.length,0,'overflow guard must not create ledger movements');
            assert.ok(alerts.some(x=>x.includes('الرصيد الحالي')),'overflow should be reported as invalid resulting stock');
          }
