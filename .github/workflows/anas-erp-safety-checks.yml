          window.anasTruckSettle('T1');
          assert.equal(AppData.products[0].stock, 6, 'one returned unit goes back to main stock');
          assert.equal(AppData.products[0].warehouseStock['Truck T'], 0, 'return/damaged/missing units leave truck balance');
          assert.equal(AppData.stockMovements.length, 3, 'return, damaged and missing each get a ledger movement');
          assert.equal(AppData.truckTrips[0].settlementInvoiceIds[0], 'INV-1');
          assert.ok(AppData.truckTrips[0].settledAt);
          const moves = AppData.stockMovements.length;
          window.anasTruckSettle('T1');
          assert.equal(AppData.stockMovements.length, moves, 'repeat settlement must not duplicate movements');

          // Reject invoices from another warehouse before any stock or ledger mutation.
          global.prompt = (() => {
            const answers = ['6','1','1','2','INV-WRONG'];
            return () => answers.shift();
          })();
          let invalidInvoiceSaveCalled = false;
          global.saveDB = () => { invalidInvoiceSaveCalled = true; return true; };
          global.AppData = {
            products: [{id:'p1',name:'Product',stock:5,warehouseStock:{'Truck T':4}}],
            truckTrips: [{id:'T3',plate:'T',status:'delivered',stockPostedAt:'loaded',warehouseName:'Truck T',stockItems:[{productId:'p1',productName:'Product',qty:10}]}],
            invoices: [{id:'INV-WRONG',warehouse:'Main warehouse',warehouseName:'Main warehouse',items:[{id:'p1',qty:6}]}],
            stockMovements: []
          };
          window.anasTruckSettle('T3');
          assert.equal(invalidInvoiceSaveCalled, false, 'wrong-warehouse invoice must not be persisted');
          assert.equal(AppData.products[0].stock, 5, 'wrong-warehouse invoice must not change main stock');
          assert.equal(AppData.products[0].warehouseStock['Truck T'], 4, 'wrong-warehouse invoice must not change truck stock');
          assert.equal(AppData.stockMovements.length, 0, 'wrong-warehouse invoice must not create ledger movements');
          assert.equal(Object.hasOwn(AppData.truckTrips[0], 'settlementId'), false, 'invalid invoice must not mark trip settled');

          global.prompt = (() => {
            const answers = ['6','1','1','2','INV-1'];
            return () => answers.shift();
          })();
          global.saveDB = () => false;
          global.AppData = {
            products: [{id:'p1',name:'Product',stock:5,warehouseStock:{'Truck T':4}}],
            truckTrips: [{id:'T2',plate:'T',status:'delivered',stockPostedAt:'loaded',warehouseName:'Truck T',stockItems:[{productId:'p1',productName:'Product',qty:10}]}],
            invoices: [{id:'INV-1',warehouse:'Truck T',warehouseName:'Truck T',items:[{id:'p1',qty:6}]}],
            stockMovements: [{id:'prior'}]
          };
          window.anasTruckSettle('T2');
          assert.equal(AppData.products[0].stock, 5, 'failed save restores main stock');
          assert.equal(AppData.products[0].warehouseStock['Truck T'], 4, 'failed save restores truck stock');
          assert.deepEqual(AppData.stockMovements, [{id:'prior'}], 'failed save restores movement ledger');
          assert.equal(Object.hasOwn(AppData.truckTrips[0], 'settlementId'), false, 'failed save removes settlement marker');
          // Reject empty invoice details and malformed invoice lines before any persistence.
          for (const badInvoice of [
            {id:'INV-EMPTY',warehouse:'Truck T',warehouseName:'Truck T',items:[]},
            {id:'INV-BAD-QTY',warehouse:'Truck T',warehouseName:'Truck T',items:[{id:'p1',qty:-2}]},
            {id:'INV-BAD-ID',warehouse:'Truck T',warehouseName:'Truck T',items:[{id:'',qty:6}]}
          ]) {
            global.prompt = (() => {
              const answers = ['6','1','1','2',badInvoice.id];
              return () => answers.shift();
            })();
            let badInvoiceSaveCalled = false;
            global.saveDB = () => { badInvoiceSaveCalled = true; return true; };
            global.AppData = {
              products: [{id:'p1',name:'Product',stock:5,warehouseStock:{'Truck T':4}}],
              truckTrips: [{id:'TBAD',plate:'T',status:'delivered',stockPostedAt:'loaded',warehouseName:'Truck T',stockItems:[{productId:'p1',productName:'Product',qty:10}]}],
              invoices: [badInvoice],
              stockMovements: []
            };
            window.anasTruckSettle('TBAD');
            assert.equal(badInvoiceSaveCalled, false, badInvoice.id + ' must not be persisted');
            assert.equal(AppData.products[0].stock, 5, badInvoice.id + ' must not mutate main stock');
            assert.equal(AppData.products[0].warehouseStock['Truck T'], 4, badInvoice.id + ' must not mutate truck stock');
            assert.equal(AppData.stockMovements.length, 0, badInvoice.id + ' must not create ledger movements');
            assert.equal(Object.hasOwn(AppData.truckTrips[0], 'settlementId'), false, badInvoice.id + ' must not mark trip settled');
          }
          console.log('Truck settlement mock tests passed: invoice match, stock partition, idempotency, rollback, empty details and malformed invoice lines');
          """
          js = "global.window = {}; const window = global.window;\n" + js.replace("/*INSERT_TRUCK_SETTLEMENT_FUNCTION*/", function_js)
          Path("/tmp/anas-truck-settlement-test.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/anas-truck-settlement-test.js
          node /tmp/anas-truck-settlement-test.js
      - name: Verify stock reads preserve malformed values as invalid
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          start = s.find("        function wtReadStockBalance(")
          end = s.find("        function wtEnsureMobileWarehouse(", start)
          assert start >= 0 and end > start, "Could not isolate stock balance reader"
          function_js = s[start:end]
          js = r"""
          /*INSERT_STOCK_READER*/
          const assert = require('node:assert/strict');
          const main = (stock) => wtReadStockBalance({stock}, 'المخزن الرئيسي');
          assert.equal(main(12), 12);
          assert.equal(main(' 12 '), 12);
          assert.equal(main(undefined), NaN, 'explicit undefined must not be coerced to zero');
          assert.equal(main('   '), NaN, 'blank primary balance must remain invalid');
          assert.equal(main(null), NaN, 'null primary balance must remain invalid');
          assert.equal(main(true), NaN, 'boolean primary balance must remain invalid');
          assert.equal(main(-1), NaN, 'negative primary balance must remain invalid');
          assert.equal(wtReadStockBalance({}, 'المخزن الرئيسي'), 0, 'absent legacy primary stock retains zero default');
          assert.equal(wtReadStockBalance({stock:10,warehouseStock:{A:' '}}, 'A'), NaN, 'blank secondary balance must remain invalid');
          assert.equal(wtReadStockBalance({stock:10,warehouseStock:{A:true}}, 'A'), NaN, 'boolean secondary balance must remain invalid');
          assert.equal(wtReadStockBalance({stock:10,warehouseStock:{A:3}}, 'A'), 3);
          assert.equal(wtReadStockBalance({stock:10,warehouseStock:{}}, 'B'), 0, 'absent secondary warehouse balance is zero');
          assert.equal(wtReadStockBalance({stock:10,warehouseStock:[]}, 'A'), NaN, 'malformed stock map must remain invalid');
          console.log('Stock balance reader tests passed: valid, legacy-absent, blank, null, boolean, negative, and malformed map cases');
          """
          js = js.replace("/*INSERT_STOCK_READER*/", function_js)
          Path("/tmp/anas-stock-reader-test.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/anas-stock-reader-test.js
          node /tmp/anas-stock-reader-test.js
      - name: Execute cloud restore validator corruption tests
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("index.html").read_text(encoding="utf-8")
          start = app.find("        function anasValidateIncomingSyncData(incoming) {")
          end = app.find("async function syncPushNow()", start)
          assert start >= 0 and end > start, "Could not isolate cloud restore validator"
          function_js = app[start:end]
          js = r"""
          const assert = require('node:assert/strict');
          /*INSERT_SYNC_VALIDATOR*/
          const base = () => ({products:[{id:'p1',stock:8,warehouseStock:{'Legacy':3}}],customers:[],suppliers:[],invoices:[]});
          const valid = base();
          valid.warehouses = ['Legacy'];
          assert.equal(anasValidateIncomingSyncData(valid), valid, 'valid legacy warehouse names must remain supported');
          assert.deepEqual(valid.stockMovements, [], 'absent legacy movement ledger should be initialized');
          assert.deepEqual(valid.warehouseTransfers, [], 'absent legacy transfer history should be initialized');
          for (const key of ['stockMovements','warehouseTransfers','purchases','expenses','users','trucks','returns']) {
            const bad = base(); bad[key] = null;
            assert.throws(() => anasValidateIncomingSyncData(bad), Error, key + ' explicit null must be rejected');
          }
          for (const warehouses of [null, {}, [null], ['   '], [{name:'   '}], [{name:[]} ]]) {
            const bad = base(); bad.warehouses = warehouses;
            assert.throws(() => anasValidateIncomingSyncData(bad), Error, 'malformed warehouses must be rejected');
          }
          for (const stock of [' ', null, true, {}, [], -1, Infinity]) {
            const bad = base(); bad.products[0].stock = stock;
            assert.throws(() => anasValidateIncomingSyncData(bad), Error, 'malformed primary stock must be rejected');
          }
          for (const warehouseStock of [null, [], 'invalid']) {
            const bad = base(); bad.products[0].warehouseStock = warehouseStock;
            assert.throws(() => anasValidateIncomingSyncData(bad), Error, 'malformed warehouse stock map must be rejected');
          }
          for (const warehouseStock of [{'   ':2}, {Legacy:' '}, {Legacy:true}, {Legacy:-1}, {Legacy:Infinity}]) {
            const bad = base(); bad.products[0].warehouseStock = warehouseStock;
            assert.throws(() => anasValidateIncomingSyncData(bad), Error, 'malformed warehouse key/balance must be rejected');
          }
          const missingCollections = base();
          delete missingCollections.products[0].warehouseStock;
          assert.equal(anasValidateIncomingSyncData(missingCollections), missingCollections, 'absent legacy warehouse stock map remains compatible');
          console.log('Cloud restore validator tests passed: valid legacy data, explicit null history, malformed warehouse lists/maps, and invalid balances');
          """
          js = js.replace("/*INSERT_SYNC_VALIDATOR*/", function_js)
          Path("/tmp/anas-cloud-restore-validator-test.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/anas-cloud-restore-validator-test.js
          node /tmp/anas-cloud-restore-validator-test.js
