          s = Path("index.html").read_text(encoding="utf-8")
          def extract(name):
              start = s.find("function " + name + "(")
              end = s.find("\n        function ", start + 10)
              assert start >= 0 and end > start, "Could not isolate " + name
              return s[start:end]
          names = ["switchPosScreen", "clearAllPosScreens", "clearPosCart", "setPosPriceTier", "saveAppSettings"]
          functions = {name:extract(name) for name in names}
          js = r"""
          const assert = require('node:assert/strict');
          const vm = require('node:vm');
          const sources = /*INSERT_FUNCTIONS*/;
          function run(name, extra={}) {
            const alerts=[];
            const oldCart=[{id:'p',price:12}];
            const carts={1:oldCart,2:[{id:'other',price:4}],3:[],4:[],quote:[]};
            const oldConfig={name:'Old Store'};
            const fields={
              cfgAppName:{value:'New App'},cfgStoreName:{value:'New Store'},
              cfgStoreRC:{value:'rc'},cfgStoreNIF:{value:'nif'},cfgStoreNIS:{value:'nis'},
              cfgStoreArt:{value:'art'},cfgStorePhone:{value:'phone'},cfgStorePhone2:{value:'phone2'},
              cfgStoreAddress:{value:'address'},cfgStoreLocation:{value:'location'},
              cfgPrinterWidth:{value:'58mm'},cfgReceiptFooter:{value:'footer'}
            };
            const ctx={
              AppData:{activePosScreenTab:1,posScreensCarts:carts,activePriceTier:1,
                products:[{id:'p',price1:10,price2:20,price3:30}],appName:'Old App',storeConfig:oldConfig},
              posCart:oldCart,confirm:()=>true,saveDB:()=>false,alert:m=>alerts.push(String(m)),
              console:{error:()=>{}},closeModal:()=>{},renderPosTable:()=>{},
              document:{getElementById:id=>fields[id]||null},
              openView:()=>{throw new Error('must not navigate after failed save');},
              ...extra
            };
            vm.runInNewContext(sources[name]+'\nthis.invoke='+name+';',ctx);
            ctx.invoke(name==='switchPosScreen'?'2':name==='setPosPriceTier'?2:undefined);
            return {ctx,alerts,oldCart,carts,oldConfig};
          }
          let r=run('switchPosScreen');
          assert.equal(r.ctx.AppData.activePosScreenTab,1,'failed screen switch restores active tab');
          assert.equal(r.ctx.posCart,r.oldCart,'failed screen switch restores active cart');
          assert.equal(r.ctx.AppData.posScreensCarts,r.carts,'failed screen switch restores cart map');
          assert.ok(r.alerts.some(x=>x.includes('تعذر حفظ تبديل شاشة البيع')));
          r=run('clearAllPosScreens');
          assert.equal(r.ctx.AppData.posScreensCarts,r.carts,'failed clear restores original cart map');
          assert.equal(r.ctx.posCart,r.oldCart,'failed clear restores active cart');
          assert.ok(r.alerts.some(x=>x.includes('تعذر حفظ مسح شاشات البيع')));
          r=run('clearPosCart');
          assert.equal(r.ctx.posCart,r.oldCart,'failed single-cart clear restores active cart');
          assert.equal(r.ctx.AppData.posScreensCarts,r.carts,'failed single-cart clear restores cart map identity');
          assert.equal(r.ctx.AppData.posScreensCarts[1],r.oldCart,'failed single-cart clear restores active tab entry');
          assert.ok(r.alerts.length===0,'clear cart does not show success after persistence failure');
          r=run('setPosPriceTier');
          assert.equal(r.ctx.AppData.activePriceTier,1,'failed tier update restores old tier');
          assert.equal(r.ctx.posCart[0].price,12,'failed tier update restores cart price');
          assert.ok(r.alerts.some(x=>x.includes('تعذر حفظ مستوى سعر البيع')));
          r=run('saveAppSettings');
          assert.equal(r.ctx.AppData.appName,'Old App','failed settings save restores app name');
          assert.equal(r.ctx.AppData.storeConfig,r.oldConfig,'failed settings save restores store configuration');
          assert.ok(r.alerts.some(x=>x.includes('تعذر حفظ الإعدادات')));
          console.log('POS screen, cart clear, price tier, and settings rollback tests passed');
          """
          js = js.replace("/*INSERT_FUNCTIONS*/", json.dumps(functions))
          Path("/tmp/anas-pos-settings-rollback-test.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/anas-pos-settings-rollback-test.js
          node /tmp/anas-pos-settings-rollback-test.js

      - name: Exercise sync URL rollback when persistence fails
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s = Path("index.html").read_text(encoding="utf-8")
          start = s.find("function saveSyncSettings()")
          end = s.find("\n        function ", start + 10)
          assert start >= 0 and end > start, "Could not isolate saveSyncSettings"
          fn = s[start:end]
          js = r"""
          const assert = require('node:assert/strict');
          const vm = require('node:vm');
          const fn = /*INSERT_SYNC_FUNCTION*/;
          function run(initial, value) {
            const alerts=[], statuses=[];
            const data={...initial};
            const ctx={
              AppData:data,URL, Object, String,
              document:{getElementById:()=>({value})},
              saveDB:()=>false,
              setSyncStatus:(m,e)=>statuses.push({message:m,error:e}),
              alert:m=>alerts.push(String(m)),console:{error:()=>{}}
            };
            vm.runInNewContext(fn+'\nthis.invoke=saveSyncSettings;',ctx);
            ctx.invoke();
            return {data,alerts,statuses};
          }
          let r=run({syncUrl:'https://old.example/api'},'https://new.example/api');
          assert.equal(r.data.syncUrl,'https://old.example/api','failed save must restore previous URL');
          assert.ok(r.alerts.some(x=>x.includes('تعذر حفظ إعداد الرابط')));
          assert.ok(!r.alerts.some(x=>x.includes('تم حفظ إعداد الرابط')));
          assert.ok(r.statuses.some(x=>x.error===true),'failure status must be marked as error');
          r=run({},'https://new.example/api');
          assert.equal(Object.prototype.hasOwnProperty.call(r.data,'syncUrl'),false,'failed save must not retain a newly added URL');
          console.log('Sync URL persistence rollback tests passed');
          """
          js = js.replace("/*INSERT_SYNC_FUNCTION*/", json.dumps(fn))
          Path("/tmp/anas-sync-url-rollback-test.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/anas-sync-url-rollback-test.js
          node /tmp/anas-sync-url-rollback-test.js

      - name: Reject implicit save success in purchase and truck loading
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s = Path("index.html").read_text(encoding="utf-8")
          def extract(start_marker, end_marker, label):
              start=s.find(start_marker)
              end=s.find(end_marker,start+10)
              assert start>=0 and end>start, "Could not isolate "+label
              return s[start:end]
          purchase=extract("function savePurchaseItem() {","\n        function ","purchase")
          truck=extract("function postTripStock(trip){","window.anasTruckSaveTrip = function(){","truck load")
          js=r"""
          const assert=require('node:assert/strict');
          const vm=require('node:vm');
          const purchase=/*PURCHASE*/;
          const truck=/*TRUCK*/;
          {
            const fields={
              purProductName:{value:'New Product',focus(){}},
              purBuyCost:{value:'10',focus(){}},
              purBuyQty:{value:'3',focus(){}},
              purSupplierSelect:{value:''},
              purInvoiceDate:{value:'2026-10-25'}
            };
            const ctx={
              AppData:{products:[],purchases:[]},posCart:[],
              document:{getElementById:id=>fields[id]||null},
              alert:()=>{},console:{error:()=>{}},
              saveDB:()=>undefined,
              anasCreateUniqueProductId:()=> 'P1',
              anasCreateUniqueBarcode:()=> 'B1',
              updateUIState:()=>{},updateDashboardStats:()=>{},renderPurchasesTable:()=>{},
              Number,String,Object,Array,JSON,Date,Math
            };
            vm.runInNewContext(purchase+'\nthis.runPurchase=savePurchaseItem;',ctx);
            ctx.runPurchase();
            assert.equal(ctx.AppData.products.length,0,'purchase must roll back if saveDB does not explicitly return true');
            assert.equal(ctx.AppData.purchases.length,0,'purchase record must not remain after implicit save result');
            assert.equal(fields.purProductName.value,'New Product','failed purchase must preserve form inputs');
          }
          {
            const ctx={
              AppData:{products:[{id:'P1',name:'Product',stock:10,warehouseStock:{}}],stockMovements:[],warehouses:[]},
              saveDB:()=>undefined,
              wtEnsureMobileWarehouse:name=>{if(!ctx.AppData.warehouses.includes(name))ctx.AppData.warehouses.push(name);},
              Number,String,Object,Array,Map,Date,JSON,Error
            };
            vm.runInNewContext(truck+'\nthis.runLoad=postTripStock;',ctx);
            const trip={id:'T1',warehouseName:'Truck T',stockItems:[{productId:'P1',qty:4}]};
            assert.throws(()=>ctx.runLoad(trip),/تعذر حفظ حركة التحميل/,'truck load must reject undefined save result');
            assert.equal(ctx.AppData.products[0].stock,10,'main stock must roll back');
            assert.equal(JSON.stringify(ctx.AppData.products[0].warehouseStock),'{}','truck stock must roll back');
            assert.equal(ctx.AppData.stockMovements.length,0,'ledger must roll back');
            assert.equal(ctx.AppData.warehouses.length,0,'warehouse creation must roll back');
            assert.equal(Object.hasOwn(trip,'stockPostedAt'),false,'posting marker must roll back');
          }
          console.log('Explicit save-success contract tests passed for purchases and truck loading');
          """
          js=js.replace("/*PURCHASE*/",json.dumps(purchase)).replace("/*TRUCK*/",json.dumps(truck))
          Path("/tmp/anas-explicit-save-success-test.js").write_text(js,encoding="utf-8")
          PY
          node --check /tmp/anas-explicit-save-success-test.js
          node /tmp/anas-explicit-save-success-test.js
