          global.AppData={cashMovements:[{amount:7}]};
          assert.throws(()=>anasValidateIncomingSyncData(base()),Error,'cloud restore must reject omitted cash movement history when local history exists');
          global.AppData={cashMovements:[]};
          assert.equal(anasValidateIncomingSyncData(base()).cashMovements.length,0,'empty local cash history remains compatible with legacy cloud payloads');
          global.AppData={};
          for (const [label, mutate] of [
            ['boolean cloud cash balance', d=>d.caisseBalance=true],
            ['array cloud cash balance', d=>d.caisseBalance=[5]],
            ['malformed cloud cash balance', d=>d.caisseBalance='100oops'],
            ['negative cloud cash balance', d=>d.caisseBalance=-1]
          ]) {
            const bad=validAccounting(); mutate(bad);
            assert.throws(()=>anasValidateIncomingSyncData(bad),Error,label);
          }
          global.AppData={caisseBalance:75};
          const omittedNonzeroCash=validAccounting(); delete omittedNonzeroCash.caisseBalance;
          assert.throws(()=>anasValidateIncomingSyncData(omittedNonzeroCash),Error,'cloud restore must reject omitted non-zero local cash balance');
          global.AppData={caisseBalance:0};
          const omittedZeroCash=validAccounting(); delete omittedZeroCash.caisseBalance;
          assert.equal(anasValidateIncomingSyncData(omittedZeroCash),omittedZeroCash,'legacy cloud payload without cash balance remains compatible when local balance is zero');
          global.AppData={};
          const badAccountingCases = [
            ['boolean invoice total', d=>d.invoices[0].total=true],
            ['array invoice paid', d=>d.invoices[0].paid=[5]],
            ['malformed invoice remaining', d=>d.invoices[0].remaining='15oops'],
            ['boolean invoice line quantity', d=>d.invoices[0].items[0].qty=false],
