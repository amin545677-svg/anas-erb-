name: ANAS ERP Safety Checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "cloudflare/**"
      - "firebase/**"
      - ".github/workflows/anas-erp-safety-checks.yml"
      - ".github/workflows/deploy-firebase-worker.yml"
  pull_request:
    paths:
      - "index.html"
      - "cloudflare/**"
      - "firebase/**"
      - ".github/workflows/anas-erp-safety-checks.yml"
      - ".github/workflows/deploy-firebase-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate full app remains intact
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          assert len(s.encode("utf-8")) > 400_000, f"Unexpectedly small app entry point: {p.stat().st_size} bytes"
          assert "ANAS_THE_ENTERPRISE_V11_OFFLINE" in s, "Existing local data key is missing"
          assert "anasFirebaseGoogleLogin" in s, "Firebase Google login hook is missing"
          assert "anasWorkerUrl" in s, "Worker configuration field is missing"
          assert "</html>" in s.lower(), "HTML document appears incomplete"
          print(f"Full app entry point present: {p.stat().st_size} bytes")
          PY
      - name: Check Worker JavaScript syntax
        run: node --check cloudflare/worker_firebase_snapshot.js
      - name: Check OpenAI AI Worker JavaScript syntax
        run: node --check cloudflare/worker_openai_ai.js
      - name: Validate Worker contract and security guards
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("cloudflare/worker_firebase_snapshot.js").read_text(encoding="utf-8")
          required = [
              "verifyFirebaseToken", "Access-Control-Allow-Origin",
              "request.method === \"GET\"", "request.method === \"POST\"",
              "Array.isArray(appData.products)", "Array.isArray(appData.customers)",
              "MAX_BODY_BYTES", "FIREBASE_PROJECT_ID", "ALLOWED_ORIGINS"
          ]
          missing = [x for x in required if x not in s]
          assert not missing, f"Missing Worker safety/contract markers: {missing}"
          print("Worker syntax and required contract markers passed")
          PY
      - name: Validate OpenAI AI gateway health and UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("cloudflare/worker_openai_ai.js").read_text(encoding="utf-8")
          app = Path("index.html").read_text(encoding="utf-8")
          deploy = Path(".github/workflows/deploy-openai-ai-worker.yml").read_text(encoding="utf-8")
          checks = {
              "health endpoint reports the expected service": '"service: "anas-erp-openai-ai"' in worker,
              "health endpoint reports API-key configuration without exposing the key": "configured: Boolean(env.OPENAI_API_KEY)" in worker,
              "health endpoint returns model metadata": "model: env.OPENAI_MODEL || DEFAULT_MODEL" in worker,
              "request body has a size limit": "MAX_BODY_BYTES" in worker,
              "OpenAI calls disable response storage": "store: false" in worker,
              "UI calls the health endpoint": "fetch(url+'/health'" in app,
              "UI verifies the worker service identity": "anas-erp-openai-ai" in app,
              "UI submits chat messages": "type:'chat'" in app and "businessData: anasBuildBusinessSnapshot()" in app,
              "UI reads the text response": "data.text" in app,
              "manual deployment requires Cloudflare token": "secrets.CLOUDFLARE_API_TOKEN" in deploy,
              "manual deployment requires Cloudflare account id": "secrets.CLOUDFLARE_ACCOUNT_ID" in deploy,
              "manual deployment requires OpenAI key": "secrets.OPENAI_API_KEY" in deploy,
              "worker deployment remains manual-only": "workflow_dispatch:" in deploy and "push:" not in deploy,
          }
          missing = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(("PASS" if passed else "FAIL") + ": " + name)
          if missing:
              raise SystemExit("AI gateway contract checks failed: " + "; ".join(missing))
          print(f"All {len(checks)} AI gateway contract checks passed.")
          PY
      - name: Check contextual AI helper JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          marker = "<!-- ANAS ERP: contextual AI helper available throughout the app; additive only -->"
          start = s.find(marker)
          assert start >= 0, "Contextual AI helper marker not found"
          script_start = s.find("<script>", start)
          script_end = s.find("</script>", script_start)
          assert script_start >= 0 and script_end > script_start, "Contextual AI helper script block is incomplete"
          js = s[script_start + len("<script>"):script_end]
          Path("/tmp/anas-context-ai-helper.js").write_text(js, encoding="utf-8")
          print("Extracted contextual AI helper script for syntax validation")
          PY
          node --check /tmp/anas-context-ai-helper.js
      - name: Validate contextual AI helper privacy guards
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="anasContextAiFab"', 'id="anasContextAiPanel"',
              "anasErpAiGatewayUrlV1", "function safeContext(el)",
              "type==='password'||type==='file'",
              "let savedUrl='';", "try{savedUrl=localStorage.getItem",
              "if(include.checked&&typeof window.anasBuildBusinessSnapshot==='function')",
              "لم تُرسل قيمة الخانة."
          ]
          missing = [x for x in required if x not in s]
          assert not missing, f"Missing contextual AI helper/privacy markers: {missing}"
          print("Contextual AI helper presence and privacy guards passed")
          PY
      - name: Check PDF extraction JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          marker = "async function anasExtractPdfText(file)"
          pos = s.find(marker)
          assert pos >= 0, "PDF text extraction function is missing"
          end = s.find("function parseSmartCsv(raw,delimiter)", pos)
          assert pos >= 0 and end > pos, "Could not locate the isolated PDF helper functions"
          js = s[pos:end]
          Path("/tmp/anas-pdf-helper.js").write_text(js, encoding="utf-8")
          print("Extracted isolated PDF helper functions for syntax validation")
          PY
          node --check /tmp/anas-pdf-helper.js
      - name: Exercise PDF helper limits and cleanup with mocks
        run: |
          python - <<'PY'
          from pathlib import Path
          js = Path("/tmp/anas-pdf-helper.js").read_text(encoding="utf-8")
          js += r"""
          const assert = require('node:assert/strict');
          global.window = { pdfjsLib: { GlobalWorkerOptions: {}, getDocument: null } };
          (async () => {
            let opened = false;
            const oversized = { size: 20 * 1024 * 1024 + 1, arrayBuffer: async () => { opened = true; return new ArrayBuffer(0); } };
            await assert.rejects(() => anasExtractPdfText(oversized), /يتجاوز 20 ميغابايت/);
            assert.equal(opened, false, 'oversized file must be rejected before reading bytes');

            let fetchedPages = 0, cleanedPages = 0, destroyed = false;
            window.pdfjsLib.getDocument = () => ({ promise: Promise.resolve({
              numPages: 102,
              getPage: async n => {
                fetchedPages++;
                return {
                  getTextContent: async () => ({ items: [{ str: 'صفحة-' + n }] }),
                  cleanup: () => { cleanedPages++; }
                };
              },
              destroy: async () => { destroyed = true; }
            }) });
            const result = await anasExtractPdfText({ size: 10, arrayBuffer: async () => new ArrayBuffer(8) });
            assert.equal(result.pages, 102);
            assert.equal(fetchedPages, 100, 'only the first 100 pages should be extracted');
            assert.equal(cleanedPages, 100, 'each processed page should be cleaned up');
            assert.equal(destroyed, true, 'PDF resources should be destroyed');
            assert.match(result.text, /صفحة-100/);
            assert.doesNotMatch(result.text, /صفحة-101/);
            assert.match(result.text, /أول 100 صفحة/);
            console.log('PDF mock tests passed: size cap, 100-page cap, cleanup, and truncation notice');
          })().catch(err => { console.error(err); process.exitCode = 1; });
          """
          Path("/tmp/anas-pdf-helper-test.js").write_text(js, encoding="utf-8")
          PY
          node /tmp/anas-pdf-helper-test.js
      - name: Validate document center capabilities and privacy
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          required = [
              "مركز الملفات الذكي | Excel · PDF",
              'accept=".csv,.txt,.xlsx,.xls,.pdf,application/pdf',
              "async function anasExtractPdfText(file)",
              "const maxBytes=20*1024*1024;",
              "if(file.size>maxBytes)",
              "Math.min(pageCount,100)",
              "if(page.cleanup)page.cleanup();",
              "if(pdf.destroy)await pdf.destroy();",
              "تعذر استخراج النص من الصفحة التالية",
              "قد يكون تالفًا أو محميًا بكلمة مرور",
              "function anasDownloadPdfText()",
              "async function anasAskAiAboutPdf()",
              "documentText:text.slice(0,28000)",
              "function handleSmartAiUpload(e)",
              "function parseSmartCsv(raw,delimiter)",
              "function showSmartImportPreview(fileName,rows)",
              "function anasRunLocalBusinessAudit()"
          ]
          missing = [x for x in required if x not in s]
          assert not missing, f"Missing document-center capabilities/privacy markers: {missing}"
          assert "if(!question||!question.trim())return;" in s, "AI analysis must require an explicit user-confirmed question"
          print("Document center capabilities and explicit-send guard passed")
          PY
      - name: Exercise customer debt settlement and cash rollback with mocks
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          start = s.find("function collectCustDebt(cId)")
          end = s.find("function openGoogleMaps(loc)", start)
          assert start >= 0 and end > start, "Could not isolate customer debt settlement function"
          function_js = s[start:end]
          js = r"""
          /*INSERT_CUSTOMER_DEBT_FUNCTION*/
          const assert = require('node:assert/strict');
          global.alert = () => {};
          global.renderCustomersDebts = () => {};
          global.updateCashUI = () => {};
          global.AppData = { customers: [{ id: 'c1', name: 'Client', debt: 100 }], caisseBalance: 50, currentUser: { id: 'u1', name: 'Admin' } };
          global.prompt = () => '40';
          global.saveDB = () => true;
          collectCustDebt('c1');
          assert.equal(AppData.customers[0].debt, 60, 'successful collection reduces customer debt');
          assert.equal(AppData.caisseBalance, 90, 'successful collection increases cash');
          assert.equal(AppData.cashMovements.length, 1, 'successful collection creates a cash ledger entry');
          assert.equal(AppData.cashMovements[0].amount, 40);
          assert.equal(AppData.cashMovements[0].referenceType, 'customer_debt');

          global.AppData = { customers: [{ id: 'c1', name: 'Client', debt: 100 }], caisseBalance: 50 };
          global.prompt = () => '40';
          global.saveDB = () => false;
          collectCustDebt('c1');
          assert.equal(AppData.customers[0].debt, 100, 'failed save restores customer debt');
          assert.equal(AppData.caisseBalance, 50, 'failed save restores cash balance');
          assert.equal(Object.hasOwn(AppData, 'cashMovements'), false, 'failed save removes a newly created ledger');

          global.AppData = { customers: [{ id: 'c1', name: 'Client', debt: 100 }], caisseBalance: 50 };
          global.prompt = () => '101';
          let saveCalled = false;
          global.saveDB = () => { saveCalled = true; return true; };
          collectCustDebt('c1');
          assert.equal(saveCalled, false, 'invalid amount must not be persisted');
          assert.equal(AppData.customers[0].debt, 100);
          assert.equal(AppData.caisseBalance, 50);
          console.log('Customer debt settlement tests passed: ledger entry, rollback, and invalid amount guard');
          """
          js = js.replace("/*INSERT_CUSTOMER_DEBT_FUNCTION*/", function_js)
          Path("/tmp/anas-customer-debt-test.js").write_text(js, encoding="utf-8")
          PY
          node /tmp/anas-customer-debt-test.js
      - name: Exercise truck trip status transition guards
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          start = s.find("  window.anasTruckSetStatus = function(id,status){")
          end = s.find("  // V54 draft: guarded truck custody settlement.", start)
          assert start >= 0 and end > start, "Could not isolate truck status transition function"
          function_js = s[start:end]
          js = r"""
          const assert = require('node:assert/strict');
          global.window = {};
          global.statusText = {planned:'Planned',in_transit:'In transit',delivered:'Delivered',cancelled:'Cancelled'};
          global.ensure = () => {};
          global.anasTruckRender = () => {};
          const alerts = [];
          global.alert = msg => alerts.push(String(msg));
          global.confirm = () => true;
          let saves = 0;
          global.saveDB = () => { saves++; return true; };
          global.postTripStock = () => true;
          global.AppData = {truckTrips:[{id:'T1',status:'planned',stockItems:[]}]};
          /*INSERT_TRUCK_STATUS_FUNCTION*/
          const trip = AppData.truckTrips[0];
          window.anasTruckSetStatus('T1','delivered');
          assert.equal(trip.status,'planned','must reject skipping directly to delivered');
          assert.equal(saves,0,'invalid transition must not persist');
          assert.ok(alerts.length,'invalid transition should explain rejection');

          window.anasTruckSetStatus('T1','in_transit');
          assert.equal(trip.status,'in_transit','planned trip may enter transit');
          assert.equal(saves,1,'valid transition should persist once');

          window.anasTruckSetStatus('T1','delivered');
          assert.equal(trip.status,'delivered','in-transit trip may be delivered');
          assert.equal(saves,2,'delivery transition should persist');

          window.anasTruckSetStatus('T1','planned');
          assert.equal(trip.status,'delivered','delivered trip cannot be reopened');
          assert.equal(saves,2,'reopening a delivered trip must not persist');

          AppData.truckTrips = [{id:'T2',status:'cancelled',stockItems:[]}];
          window.anasTruckSetStatus('T2','in_transit');
          assert.equal(AppData.truckTrips[0].status,'cancelled','cancelled trip must remain terminal');
          assert.equal(saves,2,'cancelled trip transition must not persist');

          AppData.truckTrips = [{id:'T3',status:'planned',stockItems:[]}];
          window.anasTruckSetStatus('T3','cancelled');
          assert.equal(AppData.truckTrips[0].status,'cancelled','planned trip may be cancelled');
          assert.equal(saves,3,'valid cancellation should persist');
          console.log('Truck status transition tests passed: legal lifecycle, skipped delivery, terminal states');
          """
          js = "global.window = {}; const window = global.window;\n" + js.replace("/*INSERT_TRUCK_STATUS_FUNCTION*/", function_js)
          Path("/tmp/anas-truck-status-test.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/anas-truck-status-test.js
          node /tmp/anas-truck-status-test.js
      - name: Exercise truck stock posting and rollback with mocks
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          start = s.find("  function postTripStock(trip){")
          end = s.find("  window.anasTruckSaveTrip = function(){", start)
          assert start >= 0 and end > start, "Could not isolate truck stock posting function"
          function_js = s[start:end]
          js = r"""
          /*INSERT_TRUCK_STOCK_FUNCTION*/
          const assert = require('node:assert/strict');
          global.AppData = {
            products: [{ id: 'p1', name: 'Product', stock: 10, warehouseStock: {} }],
            stockMovements: [],
            warehouses: []
          };
          global.wtEnsureMobileWarehouse = name => {
            if (!AppData.warehouses.includes(name)) AppData.warehouses.push(name);
          };
          global.saveDB = () => true;
          const trip = {
            id: 'TR-TEST-1',
            plate: 'TEST',
            warehouseName: 'Truck TEST',
            stockItems: [{ productId: 'p1', productName: 'Product', qty: 4 }]
          };
          assert.equal(postTripStock(trip), true);
          assert.equal(AppData.products[0].stock, 6, 'load reduces main stock once');
          assert.equal(AppData.products[0].warehouseStock['Truck TEST'], 4, 'load increases truck warehouse stock');
          assert.equal(AppData.stockMovements.length, 2, 'load records out and in movements');
          const postedAt = trip.stockPostedAt;
          assert.equal(postTripStock(trip), true, 'repeated posting must be idempotent');
          assert.equal(AppData.products[0].stock, 6, 'repeated posting must not deduct stock twice');
          assert.equal(AppData.stockMovements.length, 2, 'repeated posting must not duplicate ledger entries');
          assert.equal(trip.stockPostedAt, postedAt);

          global.AppData = {
            products: [{ id: 'p1', name: 'Product', stock: 10, warehouseStock: { Existing: 2 } }],
            stockMovements: [{ id: 'old' }],
            warehouses: ['Existing']
          };
          global.saveDB = () => false;
          const failedTrip = {
            id: 'TR-TEST-2',
            plate: 'TEST2',
            warehouseName: 'Truck TEST2',
            stockItems: [{ productId: 'p1', productName: 'Product', qty: 4 }]
          };
          assert.throws(() => postTripStock(failedTrip), /تعذر حفظ حركة التحميل/);
          assert.equal(AppData.products[0].stock, 10, 'failed save restores main stock');
          assert.deepEqual(AppData.products[0].warehouseStock, { Existing: 2 }, 'failed save restores warehouse stock');
          assert.deepEqual(AppData.stockMovements, [{ id: 'old' }], 'failed save restores prior movement ledger');
          assert.deepEqual(AppData.warehouses, ['Existing'], 'failed save restores prior warehouse list');
          assert.equal(Object.hasOwn(failedTrip, 'stockPostedAt'), false, 'failed save removes posted marker');
          console.log('Truck stock tests passed: one-time load, movement ledger, and rollback on failed save');
          """
          js = js.replace("/*INSERT_TRUCK_STOCK_FUNCTION*/", function_js)
          Path("/tmp/anas-truck-stock-test.js").write_text(js, encoding="utf-8")
          PY
          node /tmp/anas-truck-stock-test.js
      - name: Validate Firebase rules are user-scoped
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          rules = Path("firebase/firestore.rules").read_text(encoding="utf-8")
          config = json.loads(Path("firebase.json").read_text(encoding="utf-8"))
          assert config.get("firestore", {}).get("rules") == "firebase/firestore.rules", "firebase.json does not point to Firestore rules"
          assert "request.auth != null" in rules, "Firestore rules must require authentication"
          assert "request.auth.uid == userId" in rules, "Firestore rules must restrict snapshots to their owner"
          print("Firestore rules configuration and owner-only access checks passed")
          PY

      - name: Exercise truck custody settlement and rollback with mocks
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          start = s.find("  window.anasTruckSettle = function(id){")
          end = s.find("  window.anasTruckDelete = function(id){", start)
          assert start >= 0 and end > start, "Could not isolate truck settlement function"
          function_js = s[start:end]
          js = r"""
          const assert = require('node:assert/strict');
          global.alert = () => {};
          global.anasTruckRender = () => {};
          global.ensure = () => {
            if (!global.AppData) throw new Error('AppData unavailable');
            if (!Array.isArray(AppData.truckTrips)) AppData.truckTrips = [];
            if (typeof global.saveDB !== 'function') throw new Error('saveDB unavailable');
          };
          global.prompt = (() => {
            const answers = ['6','1','1','2','INV-1'];
            return () => answers.shift();
          })();
          global.saveDB = () => true;
          global.AppData = {
            products: [{id:'p1',name:'Product',stock:5,warehouseStock:{'Truck T':4}}],
            truckTrips: [{id:'T1',plate:'T',status:'delivered',stockPostedAt:'loaded',warehouseName:'Truck T',stockItems:[{productId:'p1',productName:'Product',qty:10}]}],
            invoices: [{id:'INV-1',warehouse:'Truck T',warehouseName:'Truck T',items:[{id:'p1',qty:6}]}],
            stockMovements: []
          };
          /*INSERT_TRUCK_SETTLEMENT_FUNCTION*/
          window.anasTruckSettle('T1');
          window.anasTruckSettle('T1');
          assert.equal(AppData.products[0].stock, 6, 'one returned unit goes back to main stock');
          assert.equal(AppData.products[0].warehouseStock['Truck T'], 0, 'return/damaged/missing units leave truck balance');
          assert.equal(AppData.stockMovements.length, 3, 'return, damaged and missing each get a ledger movement');
          assert.equal(AppData.truckTrips[0].settlementInvoiceIds[0], 'INV-1');
          assert.ok(AppData.truckTrips[0].settledAt);
          const moves = AppData.stockMovements.length;
          window.anasTruckSettle('T1');
          assert.equal(AppData.stockMovements.length, moves, 'repeat settlement must not duplicate movements');

          // Reject invoices from another warehouse before any stock or ledger mutation.
          global.prompt = (() => {
            const answers = ['6','1','1','2','INV-WRONG'];
            return () => answers.shift();
          })();
          let invalidInvoiceSaveCalled = false;
          global.saveDB = () => { invalidInvoiceSaveCalled = true; return true; };
          global.AppData = {
            products: [{id:'p1',name:'Product',stock:5,warehouseStock:{'Truck T':4}}],
            truckTrips: [{id:'T3',plate:'T',status:'delivered',stockPostedAt:'loaded',warehouseName:'Truck T',stockItems:[{productId:'p1',productName:'Product',qty:10}]}],
            invoices: [{id:'INV-WRONG',warehouse:'Main warehouse',warehouseName:'Main warehouse',items:[{id:'p1',qty:6}]}],
            stockMovements: []
          };
          window.anasTruckSettle('T3');
          assert.equal(invalidInvoiceSaveCalled, false, 'wrong-warehouse invoice must not be persisted');
          assert.equal(AppData.products[0].stock, 5, 'wrong-warehouse invoice must not change main stock');
          assert.equal(AppData.products[0].warehouseStock['Truck T'], 4, 'wrong-warehouse invoice must not change truck stock');
          assert.equal(AppData.stockMovements.length, 0, 'wrong-warehouse invoice must not create ledger movements');
          assert.equal(Object.hasOwn(AppData.truckTrips[0], 'settlementId'), false, 'invalid invoice must not mark trip settled');

          global.prompt = (() => {
            const answers = ['6','1','1','2','INV-1'];
            return () => answers.shift();
          })();
          global.saveDB = () => false;
          global.AppData = {
            products: [{id:'p1',name:'Product',stock:5,warehouseStock:{'Truck T':4}}],
            truckTrips: [{id:'T2',plate:'T',status:'delivered',stockPostedAt:'loaded',warehouseName:'Truck T',stockItems:[{productId:'p1',productName:'Product',qty:10}]}],
            invoices: [{id:'INV-1',warehouse:'Truck T',warehouseName:'Truck T',items:[{id:'p1',qty:6}]}],
            stockMovements: [{id:'prior'}]
          };
          window.anasTruckSettle('T2');
          assert.equal(AppData.products[0].stock, 5, 'failed save restores main stock');
          assert.equal(AppData.products[0].warehouseStock['Truck T'], 4, 'failed save restores truck stock');
          assert.deepEqual(AppData.stockMovements, [{id:'prior'}], 'failed save restores movement ledger');
          assert.equal(Object.hasOwn(AppData.truckTrips[0], 'settlementId'), false, 'failed save removes settlement marker');
          // Reject empty invoice details and malformed invoice lines before any persistence.
          for (const badInvoice of [
            {id:'INV-EMPTY',warehouse:'Truck T',warehouseName:'Truck T',items:[]},
            {id:'INV-BAD-QTY',warehouse:'Truck T',warehouseName:'Truck T',items:[{id:'p1',qty:-2}]},
            {id:'INV-BAD-ID',warehouse:'Truck T',warehouseName:'Truck T',items:[{id:'',qty:6}]}
          ]) {
            global.prompt = (() => {
              const answers = ['6','1','1','2',badInvoice.id];
              return () => answers.shift();
            })();
            let badInvoiceSaveCalled = false;
            global.saveDB = () => { badInvoiceSaveCalled = true; return true; };
            global.AppData = {
              products: [{id:'p1',name:'Product',stock:5,warehouseStock:{'Truck T':4}}],
              truckTrips: [{id:'TBAD',plate:'T',status:'delivered',stockPostedAt:'loaded',warehouseName:'Truck T',stockItems:[{productId:'p1',productName:'Product',qty:10}]}],
              invoices: [badInvoice],
              stockMovements: []
            };
            window.anasTruckSettle('TBAD');
            assert.equal(badInvoiceSaveCalled, false, badInvoice.id + ' must not be persisted');
            assert.equal(AppData.products[0].stock, 5, badInvoice.id + ' must not mutate main stock');
            assert.equal(AppData.products[0].warehouseStock['Truck T'], 4, badInvoice.id + ' must not mutate truck stock');
            assert.equal(AppData.stockMovements.length, 0, badInvoice.id + ' must not create ledger movements');
